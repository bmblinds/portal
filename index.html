async function ordAddSave(oid){
  const o = orders.find(x=>x.id===oid); if(!o) return;
  const p = $("#oad_p").value, qty = Math.max(1, Math.round(+$("#oad_q").value)||1);
  const unit = r2(+$("#oad_u").value||0), note = $("#oad_s").value.trim();
  let row;
  if(p && !window._oadManual){
    const w = +$("#oad_w").value||0, h = +$("#oad_h").value||0;
    if(!(w>0 && h>0)){ toast("Enter width and height 请输入宽高"); return; }
    const specs = {product:p, w, h, qty, mount:"Inside 内装", summary:`${w}×${h}mm · Inside 内装${note?" · "+note:""}`};
    const pr = priceLine(specs);
    row = {order_id:oid, product:p, kind:"config", specs, qty, unit_price:pr.unit, line_total:pr.total};
  } else {
    const name = p || $("#oad_n").value.trim();
    if(!name){ toast("Name is required 请填写名称"); return; }
    if(!(unit>0)){ toast("Enter a price 请填写价格"); return; }
    const w = p ? (+$("#oad_w").value||0) : 0, h = p ? (+$("#oad_h").value||0) : 0;

    row = {order_id:oid, product:label, kind:"acc", specs:{summary:note}, qty, unit_price:unit, line_total:r2(unit*qty)};
  }

async function ordQtySet(oid, lid, v){
  const o = orders.find(x=>x.id===oid); if(!o) return;
  const l = o.order_lines.find(x=>x.id===lid); if(!l) return;
  const qty = Math.max(1, Math.round(+v)||1);
  l.qty = qty;
  if(l.specs && l.specs.product){ l.specs.qty = qty; l.line_total = priceLine(l.specs).total; }
  else l.line_total = r2((+l.unit_price||0)*qty);
  const {error} = await sb.from("order_lines").update({qty:l.qty, specs:l.specs, line_total:l.line_total}).eq("id", lid);
  if(error){ toast("Update failed: "+error.message); return; }
  await ordRecalcTotal(oid); render();
}
function ordQty(oid, lid, d){
  const o = orders.find(x=>x.id===oid); const l = o && o.order_lines.find(x=>x.id===lid); if(!l) return;

function qqSmart(i){

/* every quote auto-saves into the drafts list — nothing typed is ever lost */
function qqUpsert(){
  const s = window._qq; if(!s) return false;
  const has = s.lines.some(l=>String(l.name||"").trim()) || String(s.meta.customer||"").trim();
  if(!has) return false;
  if(!s.draftId) s.draftId = "q" + Date.now().toString(36);
  const rec = { id:s.draftId, kind:"quick", name: s.meta.customer || s.meta.qno, created: today(),
                qlines: JSON.parse(JSON.stringify(s.lines)), meta: JSON.parse(JSON.stringify(s.meta)) };
  const list = myDrafts().slice();
  const i = list.findIndex(x=>x.id===s.draftId);
  const prev = i>=0 ? list[i] : null;
  const changed = !prev || JSON.stringify(prev.qlines)!==JSON.stringify(rec.qlines) || JSON.stringify(prev.meta)!==JSON.stringify(rec.meta);
  carryDraft(rec, prev, changed);
  if(prev && !changed) rec.name = prev.name; /* keep manual renames */
  if(i>=0) list[i] = rec; else list.push(rec);
  persistDrafts(list);
  return true;
}
function qqAutosave(){ clearTimeout(window._qqT); window._qqT = setTimeout(qqUpsert, 900); }
function qqCompute(){
  const s = window._qq || qqNew();
  const lines = s.lines.filter(l=>String(l.name||"").trim()).map(l=>({name:l.name, spec:l.spec||"", qty:+l.qty||1, unit:r2(+l.unit||0), pre:r2((+l.qty||1)*(+l.unit||0)), taxed:l.taxed!==false}));
  const sub = r2(lines.reduce((a,l)=>a+l.pre,0));
  const disc = Math.min(sub, r2(+s.meta.discount||0));
  const taxBase = r2(lines.filter(l=>l.taxed).reduce((a,l)=>a+l.pre,0));
  const tax = r2(taxBase * (sub>0 ? (sub-disc)/sub : 1) * TAX_RATE);
  return {lines, sub, disc, discLabel:"", tax, grand:r2(sub-disc+tax), who:profile||{}, ref:"QUICK"};
}

  const m = (window._qq || qqNew()).meta;

  const q = qqCompute(), ship = +((window._qq||{meta:{}}).meta.shipCost)||0;

  const dv=$("#qq_disc"); if(dv) dv.textContent = "−"+money(q.disc);

/* ===== Quick Quote → real order: no retyping between "yes" and production ===== */
function qqOrderRows(){
  const s = window._qq; if(!s) return [];
  return s.lines.filter(l=>String(l.name||"").trim()).map(l=>{
    const qty = Math.max(1, Math.round(+l.qty)||1);
    const w = +l.w||0, h = +l.h||0;
    if(l.prod && w>0 && h>0 && l.auto !== false){
      /* engine-priced product line → full config line: PO gets production dims, invoice gets correct tax */
      const dims = `${w}×${h}mm`;
      const extra = (l.spec && l.spec !== dims) ? " · " + l.spec : "";
      const specs = {product:l.prod, w, h, qty, mount:"Inside 内装", summary:`${dims} · Inside 内装${extra}`};
      const p = priceLine(specs);
      return {product:l.prod, kind:"config", specs, qty, unit_price:p.unit, line_total:p.total};
    }
    /* custom or negotiated-price line → fixed-price line, tax flag preserved */
    const label = l.prod ? `${l.prod}${w&&h?` ${w}×${h}mm`:""}` : l.name;
    const unit = r2(+l.unit||0);
    return {product:label, kind:"acc", specs:{summary:l.spec||"", taxed:l.taxed!==false ? undefined : false}, qty, unit_price:unit, line_total:r2(unit*qty)};
  });
}

async function qqConvert(buyerId, company){
  closeModal();
  const rows = qqOrderRows();
  if(!rows.length){ toast("Add at least one product line 请先添加产品"); return; }
  if(window._qqConverting) return; window._qqConverting = true;
  try{
    /* totals in order-land math (same rules invoices use) */
    const sub = r2(rows.reduce((a,l)=>a+l.line_total,0));
    const q = qqCompute();
    const disc = Math.min(sub, q.disc||0);
    let tax = r2(rows.reduce((a,l)=>{
      if(l.kind==="config") return a + (priceLine(l.specs).tax||0);
      return a + (l.specs && l.specs.taxed===false ? 0 : r2(l.line_total*TAX_RATE));
    },0));
    if(disc>0 && sub>0) tax = r2(tax*(sub-disc)/sub);
    const total = r2(sub - disc + tax);
    const order_no = "BM-" + Date.now().toString(36).toUpperCase();
    const {data:ord, error:e1} = await sb.from("orders")
      .insert({order_no, buyer_id:buyerId, status:0, total, discount:disc||0, discount_label: disc>0?"quote 报价折扣":"", history:[{s:0,d:today()}]})
      .select().single();
    if(e1) throw e1;
    const {error:e2} = await sb.from("order_lines").insert(rows.map(r=>({...r, order_id:ord.id})));
    if(e2) throw e2;
    /* the quote's details travel onto the order's quote — editable, printable, kept forever */
    const m = (window._qq && window._qq.meta) || {};
    saveQuoteMeta(ord.id, {qno:m.qno||"", date:m.date||today(), valid:m.valid||"30",
      customer:m.customer||company||"", cAddr:m.cAddr||"", cEmail:m.cEmail||"", cPhone:m.cPhone||"", cWechat:m.cWechat||"",
      bill:m.bill||"", shipMode:m.shipMode||"", ship:m.ship||"", shipCost:+m.shipCost||0, notes:m.notes||QUOTE_TERMS_DEFAULT, supplier:true});
    /* retire the draft — it's an order now */
    if(window._qq && window._qq.draftId){ persistDrafts(myDrafts().filter(x=>x.id!==window._qq.draftId)); }
    window._qq = null; window._quote = null;
    sendEmailFn({type:"order_email", order_id: ord.id});
    await loadOrders();
    toast(`&#9889; ${order_no} created for ${company||"customer"} 订单已生成 ✓`);
    if(isAdmin()){ openOrderView(ord.id); } else { location.hash = "orders"; render(); }
  }catch(e){ toast("Convert failed: "+(e.message||e)); }
  window._qqConverting = false;
}

function qqPickCust(id){

/* PDF download: same engine as Print (vector text) — the browser's Save-as-PDF dialog */
function loadScript(src){
  return new Promise((res, rej)=>{
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = ()=>rej(new Error("load failed"));
    document.head.appendChild(s);
    setTimeout(()=>rej(new Error("timeout")), 10000);
  });
}

async function sendEmailFn(payload){
  try{
    const {data:{session}} = await sb.auth.getSession();
    if(!session) return {error:"no session"};
    const r = await fetch(SB_URL + "/functions/v1/send-email", {
      method:"POST",
      headers:{ "Authorization":"Bearer "+session.access_token, "apikey":SB_KEY, "Content-Type":"application/json" },
      body: JSON.stringify(payload)
    });
    return await r.json().catch(()=>({ok:r.ok}));
  }catch(e){ return {error:String(e)}; }
}
async function emailInvoice(id){
  const o = orders.find(x=>x.id===id); if(!o) return;

function poLines(o, sup){
  const def = sup!==undefined ? poMfr(poMetaFor(o.id)) : null;
  return o.order_lines.filter(l => sup===undefined || (l.supplier || def) === sup).map(l=>{
    if(l.kind==="acc" || !l.specs || !l.specs.product){
      const unit = +l.unit_price||0;
      return {name:l.product, zh:"", spec:(l.specs&&l.specs.summary)||"", prod:"—", qty:+l.qty||1, unit, amt:r2(unit*(+l.qty||1))};
    }
    const t = findType(l.specs.product)||{};
    const p = priceLine(l.specs);
    const install = p.parts.length ? p.parts[p.parts.length-1][1] : 0;
    const unit = r2(p.unit - install);
    let prod = "—";
    if(t.kind==="area"||t.kind==="shutter"){ const b = billableDims(l.specs, t); prod = b.w+" × "+b.h+" mm"; }
    if(t.kind==="drape"){ prod = (l.specs.w||0)+" mm wide 轨道/杆"; }

  });
}

/* PO meta from the form if it's open for this order, else the saved draft (with sensible defaults) */
function poMetaFor(id){
  const o = orders.find(x=>x.id===id); if(!o) return {};
  if(window._ov && window._ov.orderId===id && $("#po_no")) return collectPOMeta();
  const m = getQuoteMeta("po_"+id) || {};

           mfr: m.mfr || MANUFACTURERS[0], mfrCustom: m.mfrCustom || "",
           eta: m.eta || "", notes: (m.notes!==undefined && m.notes!==null) ? m.notes
             : "Prices provisional — confirm factory cost. 采购价以厂家确认为准。\nShip to B&M: 33 Hammond, Suite 205, Irvine, CA" };
}
/* meta for one supplier's PO: suffix the number and address it to that supplier when the order splits */
function poMetaSup(id, sup){
  const m = poMetaFor(id); saveQuoteMeta("po_"+id, m);
  const o = orders.find(x=>x.id===id);
  const sups = o ? orderSuppliers(o) : [];
  if(sup===undefined || sups.length<2) return {m: (sup!==undefined && sup!==poMfr(m)) ? {...m, mfr:sup, mfrCustom:""} : m, sup};
  const idx = sups.indexOf(sup);
  return {m: {...m, pono:(m.pono||"PO")+"-"+(idx+1), mfr:sup, mfrCustom:""}, sup};
}
function viewPO(id, sup){

const ZELLE_HANDLE = "brucedcy@gmail.com";
const depositOf = o => r2(Number(o.total)*0.5);

/* payment stage for an order: what's due next */
function payStage(o){
  if(o.paid) return "done";
  if(!o.deposit_paid) return o.deposit_claimed ? "deposit_wait" : "deposit";
  return o.pay_claimed ? "balance_wait" : "balance";
}
function payChip(o, admin){
  const s = payStage(o);
  if(s==="done") return '<span class="status st4" style="margin-right:6px">&#10003; Paid</span>';
  if(s==="deposit_wait") return '<span class="status st1" style="margin-right:6px">Deposit reported</span>';
  if(s==="balance_wait") return '<span class="status st1" style="margin-right:6px">Balance reported</span>';
  if(s==="balance") return '<span class="status st0" style="margin-right:6px">Balance due 尾款</span>';
  return admin ? '<span class="status st0" style="margin-right:6px">Deposit due 定金</span>' : "";
}
function openPayModal(id){
  const o = orders.find(x=>x.id===id); if(!o || o.paid) return;
  const s = payStage(o);
  if(s==="deposit_wait" || s==="balance_wait"){ window._pay = { orderId:id }; location.hash="pay"; render(); return; }
  window._pay = { orderId: id, stage: s };
  location.hash = "pay"; render();

    <div class="panel sum">
      <h4>Order summary 订单摘要</h4>
      ${o.order_lines.map(l=>`<div class="srow"><span class="k">${esc(l.product)} × ${esc(l.qty)}</span><span class="v">${money(l.line_total)}</span></div>`).join("")}
      <div class="price-box">
        <div class="row1"><span>Order total 合计</span><span>${money(o.total)}</span></div>
        <div class="row1"><span>Deposit 定金 (50%)${o.deposit_paid?" &#10003;":""}</span><span>${money(depositOf(o))}</span></div>
        <div class="row1"><span>Balance 尾款 (50%)</span><span>${money(balanceOf(o))}</span></div>
        <div class="tot"><span>Due now 本次应付</span><span>${money(due)}</span></div>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:10px">Placed ${String(o.placed_at).slice(0,10)} · ${STATUS[o.status]}</div>
    </div>
  </div>`;
}
async function claimZelle(id, stage){
  const b = $("#payBtn"); if(b){ b.disabled = true; b.textContent = "Saving…"; }
  const upd = stage==="deposit" ? {deposit_claimed:true, pay_method:"Zelle"} : {pay_claimed:true, pay_method:"Zelle"};
  const {error} = await sb.from("orders").update(upd).eq("id", id);
  if(error){ toast("Could not save: "+error.message); if(b){ b.disabled=false; b.textContent="Try again"; } return; }
  window._pay = null;
  await loadOrders();
  location.hash="orders"; render();
  toast("Thanks — B&M will confirm receipt shortly");
}
async function confirmDeposit(id){
  const o = orders.find(x=>x.id===id); if(!o) return;
  if(!confirm("Confirm you received the "+money(depositOf(o))+" deposit for "+o.order_no+"? Check your bank's Zelle activity first.")) return;
  const {error} = await sb.from("orders").update({deposit_paid:true}).eq("id", id);
  if(error){ toast("Failed: "+error.message); return; }
  await loadOrders(); render();
  toast(o.order_no + " deposit confirmed — production can begin");
}
async function confirmPayment(id){
  const o = orders.find(x=>x.id===id); if(!o) return;
  if(!confirm("Confirm you received "+money(o.total)+" for "+o.order_no+"? Check your bank's Zelle activity first.")) return;
  const {error} = await sb.from("orders").update({paid:true, paid_at:new Date().toISOString()}).eq("id", id);
  if(error){ toast("Failed: "+error.message); return; }
  await loadOrders(); render();
  toast(o.order_no + " marked paid");
}

/* ================= ORDER CARDS (DB-backed) ================= */
function dbLineRow(l){
  const desc = l.kind==="acc" ? "" : esc((l.specs&&l.specs.summary)||"");
  return `<tr><td><b>${esc(l.product)}</b><div class="spec">${desc}</div></td>
    <td style="width:56px">× ${esc(l.qty)}</td>
    <td style="width:85px;text-align:right;font-weight:600">${money(l.line_total)}</td></tr>`;
}
function orderCard(o, admin){
  const who = admin
    ? esc((o.profiles&&o.profiles.company)||"Unknown") + ((o.profiles&&o.profiles.phone)?" · "+esc(o.profiles.phone):"")
    : "placed " + String(o.placed_at).slice(0,10);
  return `<div class="ocard">
    <div class="hd">
      <div>
        <div class="oid">${esc(o.order_no)}</div>
        <div class="who">${who} · ${o.order_lines.length} line${o.order_lines.length>1?"s":""}</div>
      </div>
      <div style="text-align:right">
        ${payChip(o, admin)}
        <span class="status st${o.status}">${STATUS[o.status]}</span>
        <div class="amt" style="margin-top:6px">${money(o.total)}</div>
      </div>
    </div>
    <div class="timeline">${STATUS.map((s,i)=>`<div class="tstep ${i<=o.status?"on":""}"><div class="bar"></div><div class="tl">${s}</div></div>`).join("")}</div>
    <details class="odetails"><summary>Lines &amp; history</summary>
      <table class="lines" style="margin-top:8px">${o.order_lines.map(dbLineRow).join("")}</table>
      <div style="margin-top:8px;color:var(--muted);font-size:12px">${(o.history||[]).map(h=>STATUS[h.s]+" "+h.d).join(" &#8594; ")}</div>
    </details>
    <div class="actions">
      ${admin ? `<select class="adv-sel" onchange="if(this.value){moveOrder('${o.id}', parseInt(this.value));} this.selectedIndex=0;">
        <option value="">Move order&#8230;</option>
        ${o.status<4 ? `<option value="1">Next &#8594; ${STATUS[o.status+1]}</option>` : ""}
        ${o.status>0 ? `<option value="-1">Previous &#8594; ${STATUS[o.status-1]}</option>` : ""}
        ${o.status+2<=4 ? `<option value="2">Skip &#8594; ${STATUS[o.status+2]}</option>` : ""}
      </select>` : ""}
      ${admin ? `<button class="btn ghost sm" onclick="openOrderView('${o.id}')">&#128269; View Order</button>` : ""}
      ${admin && o.deposit_claimed && !o.deposit_paid ? `<button class="btn primary sm" onclick="confirmDeposit('${o.id}')">&#10003; Confirm deposit received</button>` : ""}
      ${admin && o.deposit_paid && o.pay_claimed && !o.paid ? `<button class="btn primary sm" onclick="confirmPayment('${o.id}')">&#10003; Confirm balance received</button>` : ""}
      ${(!admin && !imp && !isSales() && payStage(o)==="deposit") ? `<button class="btn primary sm" onclick="openPayModal('${o.id}')">&#128179; Pay deposit 定金 ${money(depositOf(o))}</button>` : ""}
      ${(!admin && !imp && !isSales() && payStage(o)==="balance") ? `<button class="btn primary sm" onclick="openPayModal('${o.id}')">&#128179; Pay balance 尾款 ${money(balanceOf(o))}</button>` : ""}
      ${(!admin && !isSales() && (payStage(o)==="deposit_wait"||payStage(o)==="balance_wait")) ? `<span style="font-size:12px;color:var(--muted);align-self:center">Payment reported — awaiting B&amp;M confirmation</span>` : ""}
      <button class="btn ghost sm" onclick="openQuoteModal('${o.id}')">&#128196; Quote PDF</button>
      ${(isAdmin()||isSales()) ? `<button class="btn ghost sm" title="Follow up 跟进" onclick="addFUModal('order','${o.id}', ${JSON.stringify(o.order_no).replace(/"/g,"&quot;")})">&#9200; Follow up</button>` : ""}
      ${admin ? `<button class="btn ghost sm" onclick="viewInvoice('${o.id}')">&#129534; Create Invoice 发票</button>
      <button class="btn ghost sm" onclick="viewPO('${o.id}')">&#127981; Purchase Order 采购单</button>` : ""}
      ${(!admin && !(isEndUser() && !imp)) ? `<button class="btn ghost sm" onclick="reorder('${o.id}')">&#8634; Reorder</button>` : ""}
    </div>
  </div>`;
}
function reorder(id){
  const o = orders.find(x=>x.id===id); if(!o) return;
  o.order_lines.forEach(l=>{
    if(l.kind==="acc") cart.push({kind:"acc", name:l.product, price:+l.unit_price, qty:+l.qty});
    else { const c = {...l.specs}; delete c.summary; cart.push(c); }
  });
  saveCart(); location.hash="cart"; render();
  toast(o.order_lines.length + " lines copied to a new order");
}
function renderOrders(){
  const app = $("#app");
  /* impersonation shows the customer's orders; admin-as-buyer sees own */
  const mine = imp ? orders.filter(o=>o.buyer_id===imp.id)
             : isAdmin() ? orders.filter(o=>o.buyer_id===user.id) : orders;
  if(!mine.length){
    app.innerHTML = isEndUser() && !imp
      ? `<div class="zero"><h2>No orders yet</h2>
        <p>When B&amp;M places an order for you — after a visit or consultation — it appears here with live status, from confirmation through delivery.</p>
        <button class="btn primary" onclick="location.hash='showroom'">Browse the showroom</button></div>`
      : (isSales() && !imp)
      ? `<div class="zero"><h2>No sales yet 暂无成交</h2>
        <p>Pick a customer, enter their view, and place their first order — every sale you close lands here. 选择客户代下单，成交都会显示在这里。</p>
        <button class="btn primary" onclick="location.hash='customers'">Order for a Customer 代客下单</button></div>`
      : `<div class="zero"><h2>No orders yet</h2>
        <p>Configure products and submit your first order. You'll track its progress here.</p>
        <button class="btn primary" onclick="location.hash='catalog'">Browse products</button></div>`;
    return;
  }
  const open = mine.filter(o=>o.status<4);
  const q = getSearch("orders");
  const shown = mine.filter(o=>orderMatches(o,q) && fltMatches(o, fltOf("orders")));
  app.innerHTML = `
  <div class="stats">
    <div class="stat"><div class="l">Open orders</div><div class="v">${open.length}</div></div>
    <div class="stat"><div class="l">In production</div><div class="v">${mine.filter(o=>o.status===2).length}</div></div>
    <div class="stat"><div class="l">Open order value</div><div class="v">${money(open.reduce((s,o)=>s+Number(o.total),0))}</div></div>
  </div>
  ${searchBox("orders","Search orders 搜索订单…")}
  ${fltBar("orders", mine, false)}
  ${shown.length ? shown.map(o=>orderCard(o,false)).join("") : `<div class="zero"><h2>No matches</h2><p>No orders match the current search or filters. 无匹配订单。</p></div>`}`;
}
function renderAdmin(){
  const app = $("#app");
  if(!orders.length){
    app.innerHTML = `<div class="zero"><h2>No orders yet</h2><p>When dealers submit orders, they land here for you to confirm and move through to delivery.</p></div>`;
    return;
  }
  const fresh = orders.filter(o=>o.status===0);
  const month = today().slice(0,7);
  const monthVal = orders.filter(o=>String(o.placed_at).slice(0,7)===month).reduce((s,o)=>s+Number(o.total),0);
  app.innerHTML = `
  <div class="stats">
    <div class="stat"><div class="l">Awaiting confirmation</div><div class="v">${fresh.length}</div></div>
    <div class="stat"><div class="l">In production</div><div class="v">${orders.filter(o=>o.status===2).length}</div></div>
    <div class="stat"><div class="l">Orders this month</div><div class="v">${money(monthVal)}</div></div>
  </div>
  ${fresh.length ? `<div class="needs"><h3>Needs you <span class="count">${fresh.length}</span></h3>
    ${fresh.map(o=>`<div class="n-item"><div><b>${esc(o.order_no)}</b> — ${esc((o.profiles&&o.profiles.company)||"")} · ${money(o.total)}</div>
      <button class="btn primary sm" onclick="advanceOrder('${o.id}')">Confirm</button></div>`).join("")}</div>` : ""}
  ${searchBox("incoming","Search orders 搜索订单…")}
  ${fltBar("incoming", orders, true)}
  ${(()=>{ const q=getSearch("incoming"); const shown=orders.filter(o=>orderMatches(o,q) && fltMatches(o, fltOf("incoming")));
    return shown.length ? shown.map(o=>orderCard(o,true)).join("") : `<div class="zero"><h2>No matches</h2><p>No orders match the current search or filters. 无匹配订单。</p></div>`; })()}`;
}

/* ============================================================
   BOOT
============================================================ */
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ $("#auth").classList.add("on"); $("#shell").style.display="none"; return; }
  user = session.user;
  $("#auth").classList.remove("on");
  $("#shell").style.display="flex";
  $("#app").innerHTML = `<div class="loading">Loading your account…</div>`;
  await loadProfile();
  $("#whoEmail").textContent = user.email;
  if(isBlocked()){ $("#whoRole").textContent = profile.status==="deactivated" ? "Deactivated" : "Suspended"; $("#viewSeg").style.display="none"; renderBlockedApp(); return; }
  if(isPending()){ $("#whoRole").textContent = "Pending approval"; $("#viewSeg").style.display="none"; renderPendingApp(); return; }
  /* restore THIS account's cart: DB wins if it has items; else this user's local copy */
  if(!isAdmin()){
    let local = [];
    try{ local = JSON.parse(localStorage.getItem(cartKey())) || []; }catch(e){}
    if(Array.isArray(profile.cart) && profile.cart.length){
      cart = profile.cart;
      try{ localStorage.setItem(cartKey(), JSON.stringify(cart)); }catch(e){}
    } else if(local.length){
      cart = local;
      sb.from("profiles").update({cart}).eq("id", user.id).then(()=>{});
    } else {
      cart = [];
    }
  }
  await loadOrders();
  await loadUnread();
  await loadPending();
  await loadApps();
  $("#whoEmail").textContent = user.email;
  $("#whoRole").textContent = isAdmin() ? "B&M Manufacturer" : isEndUser() ? (profile.company || "End User") : (profile ? profile.company || "Dealer" : "Dealer");
  $("#viewSeg").style.display = isAdmin() ? "flex" : "none";
  startRealtime();
  if(!location.hash) location.hash = "home";
  render();
}
boot();
</script>
