<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B&amp;M Dealer Ordering System</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 148'%3E%3Cg fill='%232f5233'%3E%3Cpolygon points='8,14 112,14 106,32 14,32'/%3E%3Cpolygon points='20,40 38,40 38,138 20,124'/%3E%3Cpolygon points='46,40 64,40 64,126 46,116'/%3E%3Cpolygon points='72,40 90,40 90,114 72,107'/%3E%3Cpolygon points='98,40 112,40 112,103 98,98'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#2f5233">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --border:#e7e9ee; --text:#1a1f2b; --muted:#7a8194;
  --green:#2f5233; --green-lt:#eaf3ec; --amber:#c9861f; --amber-lt:#fdf4e3;
  --red:#c0392b; --red-lt:#fdecea; --blue:#3b6fe0; --blue-lt:#eef3fd; --orange:#d97a2b; --orange-lt:#fdf3ea;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
#shell{display:flex;min-height:100vh}

/* auth screen */
#auth{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
#auth.on{display:flex}
.auth-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:34px;width:400px;max-width:100%}
.auth-card .logo-wrap{text-align:center;margin-bottom:18px}
.auth-card h2{font-size:17px;text-align:center;margin-bottom:4px}
.auth-card .sub2{font-size:13px;color:var(--muted);text-align:center;margin-bottom:18px}
.auth-card label{display:block;font-size:12.5px;font-weight:600;color:#374151;margin:12px 0 4px}
.auth-card input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none}
.auth-card input:focus{border-color:var(--blue)}
.auth-card .btn{width:100%;margin-top:18px}
.auth-card .swap{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}
.auth-card .swap a{color:var(--green);font-weight:600;cursor:pointer;text-decoration:none}
.auth-err{background:var(--red-lt);color:var(--red);border-radius:8px;padding:9px 12px;font-size:13px;margin-top:12px;display:none}
.auth-tabs{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:18px}
.auth-tabs button{flex:1;padding:9px 4px;font-size:13px;background:#fff;border:none;color:#525a6b}
.auth-tabs button.on{background:var(--green);color:#fff;font-weight:700}

/* sidebar */
.side{width:224px;min-width:224px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.side .logo-box{padding:20px 18px 14px;border-bottom:1px solid var(--border)}
.side nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;font-size:14.5px;color:#2f3646;cursor:pointer;margin-bottom:2px}
.nav-item:hover{background:#f2f4f7}
.nav-item.active{background:var(--green-lt);color:var(--green);font-weight:700}
.nav-item .ico{width:18px;text-align:center;opacity:.8}
.nav-item .badge{margin-left:auto;background:var(--green);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.who-box{border-top:1px solid var(--border);padding:12px 14px;font-size:12px;color:var(--muted)}
.who-box .em{font-weight:700;color:#2f3646;font-size:12.5px;word-break:break-all}
.who-box .rolechip{display:inline-block;margin-top:5px;background:var(--green-lt);color:var(--green);font-weight:700;border-radius:999px;padding:2px 10px;font-size:11px}
.view-seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:10px 0 2px}
.view-seg button{flex:1;padding:7px 4px;font-size:12px;background:#fff;border:none;color:#525a6b}
.view-seg button.on{background:var(--green);color:#fff;font-weight:700}
.who-box button{margin-top:9px;width:100%;background:#fff;border:1px solid var(--border);border-radius:7px;padding:7px;font-size:12px;color:#525a6b}
.who-box button:hover{background:#f2f4f7}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 26px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.top h1{font-size:18px;font-weight:700}
.top .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.wrap{max-width:1340px;margin:0;padding:20px 26px 60px;width:100%}
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover{background:#3d6a44}
.btn.primary:disabled{background:#a9b7ac;cursor:wait}
.btn.dead{background:#c9ced8;color:#fff;cursor:not-allowed}
.btn.dead:hover{background:#c9ced8}
.btn.ghost{background:#fff;border:1px solid var(--border);color:#2f3646}
.btn.ghost:hover{background:#f4f5f7}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:7px}

/* catalog */
.sec-h{font-size:15px;font-weight:700;margin:6px 0 12px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-bottom:26px}
.pcard{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s}
.pcard:hover{border-color:var(--green)}
.pcard .swatch{height:72px;display:flex;align-items:center;justify-content:center;font-size:26px}
.swatch.photo{height:150px;background-size:cover !important;background-position:center}
.pcard .bd{padding:12px 14px;flex:1;display:flex;flex-direction:column}
.pcard .nm{font-weight:700;font-size:14px}
.pcard .pr{color:var(--green);font-weight:700;font-size:12.5px;margin-top:5px}
.pcard .cfg{margin-top:auto;padding-top:9px;color:var(--muted);font-size:12px}
.pcard:hover .cfg{color:var(--green);font-weight:600}

/* configurator */
.cf-grid{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}
.panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px}
.panel h4{font-size:14px;font-weight:700;margin-bottom:12px}
.step{border-bottom:1px solid #f0f1f4;padding:13px 0}
.step:last-child{border-bottom:none}
.step .st-h{font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;margin-bottom:9px}
.step .st-h .num{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--green-lt);color:var(--green);font-size:10.5px;align-items:center;justify-content:center;margin-right:7px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;background:#fff;color:#2f3646}
.opt:hover{border-color:#b9c4b9}
.opt.on{border-color:var(--green);background:var(--green-lt);color:var(--green);font-weight:700}
.opt .up{font-size:11px;color:var(--muted);font-weight:400;margin-left:5px}
.opt.on .up{color:var(--green)}
.dim-row{display:flex;gap:12px}
.dim-row>div{flex:1;max-width:130px}
.dim-row label{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;display:block;margin-bottom:4px}
.dim-row input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none}
.dim-row input:focus{border-color:var(--blue)}
.sum{position:sticky;top:84px}
.sum .srow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px}
.sum .srow .k{color:var(--muted)}
.sum .srow .v{font-weight:600;text-align:right}
.sum .price-box{background:var(--green-lt);border-radius:10px;padding:14px 16px;margin-top:12px}
.sum .price-box .row1{display:flex;justify-content:space-between;font-size:12.5px;color:var(--green);padding:2px 0}
.sum .price-box .tot{display:flex;justify-content:space-between;font-weight:800;font-size:19px;color:var(--green);border-top:1px solid #cfe3d4;margin-top:8px;padding-top:8px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.crumb a{color:var(--green);cursor:pointer;text-decoration:none;font-weight:600}

/* cart / orders */
.lines{width:100%;border-collapse:collapse;font-size:13.5px}
.lines th{text-align:left;font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;padding:8px 8px;border-bottom:1px solid var(--border)}
.lines td{padding:9px 8px;border-bottom:1px solid #f0f1f4;vertical-align:middle}
.lines .rm{background:none;border:none;color:#b3372a;font-size:15px}
.spec{color:var(--muted);font-size:11.5px;margin-top:3px;line-height:1.5}
.qty-step{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;width:max-content}
.qty-step button{width:30px;background:#fff;border:none;font-size:15px;color:#525a6b}
.qty-step button:hover{background:#f2f4f7}
.qty-step input{width:42px;border:none;text-align:center;font-size:13.5px;outline:none}
.cart-total{display:flex;justify-content:space-between;align-items:center;background:var(--green-lt);border-radius:10px;padding:14px 18px;margin-top:14px}
.cart-total .t{font-weight:700;color:var(--green)}
.cart-total .a{font-size:22px;font-weight:800;color:var(--green)}
.stats{display:flex;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 18px;min-width:160px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;margin-top:3px}
.ocard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.ocard .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ocard .oid{font-weight:800;font-size:15px}
.ocard .who{font-size:12.5px;color:var(--muted);margin-top:2px}
.ocard .amt{font-weight:800;font-size:17px;color:var(--green)}
.status{display:inline-flex;border-radius:999px;font-size:12px;font-weight:700;padding:3px 12px}
.st0{background:var(--amber-lt);color:var(--amber)} .st1{background:var(--blue-lt);color:#2c53a8}
.st2{background:var(--orange-lt);color:#a35a1c} .st3{background:var(--blue-lt);color:#2c53a8}
.st4{background:var(--green-lt);color:var(--green)}
.timeline{display:flex;gap:4px;margin:12px 0 4px}
.timeline .tstep{flex:1}
.timeline .bar{height:6px;border-radius:3px;background:#e7e9ee}
.timeline .tstep.on .bar{background:var(--green)}
.timeline .tl{font-size:10.5px;color:var(--muted);margin-top:4px;text-align:center}
.timeline .tstep.on .tl{color:var(--green);font-weight:700}
.odetails{margin-top:10px;font-size:13px;color:#374151}
.odetails summary{cursor:pointer;color:var(--muted);font-size:12.5px}
.ocard .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.needs{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:18px}
.needs h3{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.needs .count{background:var(--red);color:#fff;border-radius:999px;font-size:11px;min-width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.n-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px;border:1px solid #f2e3b8;background:var(--amber-lt);border-radius:8px;margin-bottom:7px;font-size:13.5px}
/* home dashboard */
.home-hero{position:relative;border-radius:14px;background:linear-gradient(115deg,var(--hero1,#203d28) 0%,var(--hero2,#2f5233) 45%,var(--hero3,#4a7a54) 100%);color:#fff;padding:34px 30px;margin-bottom:20px;overflow:hidden}
.home-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06)}
.home-hero h2{font-size:25px;font-weight:700}
.home-hero .sub3{opacity:.85;font-size:13.5px;margin-top:7px}
.qa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.qa-btn{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;font-weight:600;font-size:14px;display:flex;gap:9px;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 2px rgba(20,24,40,.04)}
.qa-btn:hover{background:#f7f8fa;border-color:#c9cfda}
.mini-list{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.mini-list h3{font-size:14px;font-weight:700;margin-bottom:10px}
.mini-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #f0f1f4;font-size:13.5px;cursor:pointer}
.mini-row:last-child{border-bottom:none}
.mini-row:hover{background:#f8f9fb}

/* order move dropdown */
.adv-sel{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.adv-sel:hover{background:#3d6a44}
.adv-sel option{background:#fff;color:var(--text);font-weight:400}

/* impersonation bar */
.imp-bar{position:sticky;top:0;z-index:30;background:var(--amber);color:#fff;padding:10px 26px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.imp-bar b{font-weight:800}
.imp-bar button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:7px;padding:6px 14px;font-size:12.5px;font-weight:700}
.imp-bar button:hover{background:rgba(255,255,255,.3)}

/* reports */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rpanel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px}
.rpanel h3{font-size:14px;font-weight:700;margin-bottom:14px}
.vbars{display:flex;align-items:flex-end;gap:12px;height:160px}
.vbar-w{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.vbar{width:68%;max-width:44px;border-radius:6px 6px 0 0;background:var(--green)}
.vbar.vb-booked{background:var(--green-lt);position:relative;overflow:hidden}
.vb-col{position:absolute;bottom:0;left:0;right:0;background:var(--green)}
.vleg{font-size:10.5px;color:var(--muted);font-weight:600;margin-left:10px}
.vleg .vk{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;vertical-align:-1px}
.vleg .vk-b{background:var(--green-lt);border:1px solid var(--border)}
.vleg .vk-c{background:var(--green)}
.vlbl{font-size:11px;color:var(--muted)}
.vval{font-size:11px;font-weight:700}
.hrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.hrow .hl{width:130px;color:#525a6b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .track{flex:1;height:10px;background:#eef0f4;border-radius:5px;overflow:hidden}
.hrow .fill{height:100%;background:var(--green);border-radius:5px}
.hrow .hv{width:78px;text-align:right;font-weight:600}
@media(max-width:900px){.rgrid{grid-template-columns:1fr}}

/* messaging */
.chat-wrap{background:#fff;border:1px solid var(--border);border-radius:12px;max-width:100%;display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:420px}
/* admin inbox: contacts + conversation side by side */
.msg-split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.msg-split .chat-wrap{max-width:none}
.msg-split .thread-row.active{background:var(--green-lt)}
.msg-split .msg-back{display:none}
@media(max-width:1000px){
  .msg-split{grid-template-columns:1fr}
  .msg-split.open .msg-left{display:none}
  .msg-split .msg-back{display:inline-block}
}
html[data-theme="dark"] .msg-split .thread-row.active{background:var(--green-lt)}
.chat-head{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
.chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:75%;border-radius:12px;padding:9px 13px;font-size:13.5px;line-height:1.5}
.bubble .meta{font-size:10.5px;opacity:.65;margin-top:4px}
.bubble .ord{display:inline-block;background:rgba(0,0,0,.08);border-radius:999px;font-size:11px;font-weight:700;padding:1px 8px;margin-bottom:4px}
.bubble.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;background:#f1f2f5;color:var(--text);border-bottom-left-radius:4px}
.chat-compose{border-top:1px solid var(--border);padding:12px;display:flex;gap:9px;align-items:flex-end}
.chat-compose textarea{flex:1;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:inherit;resize:none;outline:none;min-height:40px;max-height:110px}
.chat-compose textarea:focus{border-color:var(--blue)}
.chat-compose select{border:1px solid var(--border);border-radius:9px;padding:9px 8px;font-size:12.5px;background:#fff;max-width:150px}
.thread-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid #f0f1f4;cursor:pointer}
.thread-row:hover{background:#f8f9fb}
.thread-row .co{font-weight:700;font-size:14px}
.thread-row .last{color:var(--muted);font-size:12.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px}
.chat-empty{color:var(--muted);font-size:13px;text-align:center;margin:auto}

.zero{background:#fff;border:1px solid var(--border);border-radius:14px;text-align:center;padding:70px 20px;color:var(--muted)}
.zero h2{color:var(--text);font-size:20px;margin-bottom:8px}
.zero p{font-size:14px;max-width:460px;margin:0 auto 20px;line-height:1.55}
.loading{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}

/* quote page form */
.qlbl{display:block;font-size:12px;font-weight:600;color:#374151;margin:11px 0 4px}
.qin{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-family:inherit;outline:none;background:#fff}
.qin:focus{border-color:var(--blue)}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 20px}
.qspan2{grid-column:span 2}
.qsec{font-size:12px;font-weight:800;color:var(--green);margin:16px 0 2px;text-transform:uppercase;letter-spacing:.5px}
@media(max-width:900px){.qgrid{grid-template-columns:1fr}.qspan2{grid-column:auto}}

/* modal base (popup overlay) */
.mask{position:fixed;inset:0;background:rgba(20,24,40,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto}
.mask.open{display:flex}
.modal{background:#fff;border-radius:14px;width:460px;max-width:100%;padding:26px;box-shadow:0 10px 40px rgba(20,24,40,.25)}
.modal h3{font-size:18px;margin-bottom:14px}
.modal label{display:block;font-size:12.5px;font-weight:600;color:#374151;margin:12px 0 4px}
.modal input,.modal select,.modal textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none;background:#fff}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--blue)}

/* fixed-size centered popup variant */
.mask.center{align-items:center}
.modal.pdfview{width:900px;max-width:96vw;height:90vh;display:flex;flex-direction:column;padding:14px}
.modal.pdfview iframe{flex:1;border:1px solid var(--border);border-radius:8px;background:#fff;width:100%}
.modal.pdfview .m-actions{margin-top:12px}
.modal.faq{width:580px;max-width:94vw;height:min(72vh,660px);display:flex;flex-direction:column;overflow:hidden}
.modal.faq .faq-list{flex:1;overflow-y:auto;padding-right:6px}
.modal.faq .m-actions{margin-top:14px}

/* FAQ floating button */
.faq-fab{position:fixed;right:18px;bottom:100px;width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;border:none;font-size:21px;font-weight:800;box-shadow:0 3px 12px rgba(20,24,40,.22);z-index:60;cursor:pointer}
.faq-fab:hover{background:#3d6a44}
/* scripted assistant */

 {v:"v2.0 · b3", d:"2026-08-08", items:["Quick Quote → Convert to order 快速报价一键转订单","Fee lines keep their no-tax flag on orders 费用行免税标记保留"]},

function applyTheme(){
  document.documentElement.setAttribute("data-theme", theme.mode);
  const h = theme.hue, dark = theme.mode === "dark";
  const rs = document.documentElement.style;
  /* dark accent: start soft, brighten only as much as this hue needs to stay readable */
  const hsl2rgb = (H,S,L)=>{ S/=100; L/=100; const k=n=>(n+H/30)%12, a=S*Math.min(L,1-L),
    f=n=>L-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))); return [f(0)*255,f(8)*255,f(4)*255]; };
  const lum = c=>{ const f=v=>{v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4);};
    return 0.2126*f(c[0])+0.7152*f(c[1])+0.0722*f(c[2]); };
  const ratio = (a,b)=>{ const x=lum(a), y=lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
  let L = 58;
  if(dark){
    const cardC = [0x1c,0x22,0x2e], ltC = hsl2rgb(h,26,16);
    while(L < 82 && (ratio(hsl2rgb(h,45,L), cardC) < 4.6 || ratio(hsl2rgb(h,45,L), ltC) < 4.6)) L += 2;
  }
  rs.setProperty("--green", dark ? `hsl(${h},45%,${L}%)` : `hsl(${h},30%,26%)`);
  rs.setProperty("--green-deep", dark ? `hsl(${h},35%,33%)` : `hsl(${h},30%,26%)`);
  rs.setProperty("--green-lt", dark ? `hsl(${h},26%,16%)` : `hsl(${h},32%,93%)`);
  rs.setProperty("--hero1", `hsl(${h},32%,${dark?14:18}%)`);
  rs.setProperty("--hero2", `hsl(${h},28%,${dark?22:27}%)`);
  rs.setProperty("--hero3", `hsl(${h},24%,${dark?32:40}%)`);
}

function sqftMM(w,h){ return r2((+w||0)*(+h||0)*1.07639e-5); }
function applies(t){
  if(t.kind==="drape") return {opacity:Object.keys(t.bases).length>1, style:1, track:1, color:1, dims:1};
  if(t.kind==="shutter") return {color:1, dims:1, mount:1};
  return {opacity:!!t.rates, openType:!!(t.openTypes||t.matrix), openness:!!t.open,
          drive:1, color:1, dims:1, mount:1, control:1};
}
/* supplier dimension adjustment by mount type */
function billableDims(c, t){
  const a = t.adj || {inW:0, outW:0, outH:0};
  const inside = String(c.mount||"").indexOf("Inside")===0;
  return { w: Math.max(0, (+c.w||0) + (inside ? (a.inW||0) : (a.outW||0))),
           h: Math.max(0, (+c.h||0) + (inside ? 0 : (a.outH||0))) };
}
function motorFeeFor(t, c){
  if(!c.drive) return 0;
  if(c.drive==="std"){
    if(t.matrix)    return (t.matrix[c.openType]   || Object.values(t.matrix)[0]).motorStd || 0;
    if(t.openTypes) return (t.openTypes[c.openType]|| Object.values(t.openTypes)[0]).motorStd || 0;
    return (t.motor && t.motor.std) || 0;
  }
  return (t.motor && t.motor[c.drive]) || 0;
}
function rateFor(t, c){
  let rate = 0;
  if(t.kind==="shutter") rate = t.rate;
  else if(t.open)   rate = t.open[c.openness] !== undefined ? t.open[c.openness] : Object.values(t.open)[0];
  else if(t.matrix){ const v = t.matrix[c.openType] || Object.values(t.matrix)[0];
                     rate = v[c.opacity] !== undefined ? v[c.opacity] : v.semi; }
  else if(t.openTypes){ const v = t.openTypes[c.openType] || Object.values(t.openTypes)[0]; rate = v.base; }
  else if(t.rates)  rate = t.rates[c.opacity] !== undefined ? t.rates[c.opacity] : Object.values(t.rates)[0];
  else rate = t.base || 0;
  if(c.drive==="cordless") rate += (t.cordUp || 1);
  return r2(rate);
}
function priceLine(c){
  /* accessories: flat price × qty, taxable like any product (unless flagged tax-free, e.g. fees) */
  if(c && c.kind === "acc"){
    const q = +c.qty||1, unit = r2(+c.price||0), total = r2(unit*q);
    const tax = c.taxed === false ? 0 : r2(total*TAX_RATE);
    return {unit, total, grand: r2(total+tax), tax, parts:[["Accessory 配件", total]]};
  }
  const t = findType(c.product); if(!t) return {unit:0, total:0, parts:[]};
  const parts = [];
  const qty = +c.qty||1;
  if(t.kind==="drape"){
    const base = t.bases[c.opacity] !== undefined ? t.bases[c.opacity] : Object.values(t.bases)[0];
    const mult = DRAPE_MULT[c.style] || 2.2;
    const wM = (+c.w||0)/1000;                      /* window width in meters */
    const fabricM = r2(wM * mult);                  /* fabric length = width × fullness */
    const fabric = r2(wM * mult * base);
    const tr = DRAPE_TRACKS[c.track] || DRAPE_TRACKS.manual;
    const rod = r2(wM * tr.p);                      /* rod length = window width */
    const unit = r2(fabric + rod + DRAPE_INSTALL);
    const total = r2(unit*qty);
    const tax = r2((fabric + rod) * qty * TAX_RATE); /* install not taxed */
    parts.push(["Fabric 布料 "+fabricM+" m ("+mult+"×) × $"+base+"/m", fabric],
               [tr.l+" — "+r2(wM)+" m × $"+tr.p+"/m", rod],
               ["Install 安装", DRAPE_INSTALL]);
    return {unit, total, tax, grand:r2(total+tax), parts};
  }
  const b = billableDims(c, t);
  const areaExact = b.w * b.h * 1.07639e-5;   /* unrounded for pricing, per 工作文档 */
  const area = r2(areaExact);
  const rate = rateFor(t, c);
  /* wide windows can need more than one motor per window */
  const motorN = (c.drive==="smart" || c.drive==="std") ? Math.min(15, Math.max(1, Math.round(+c.motors)||1)) : 1;
  const motorFee = motorFeeFor(t, c) * motorN;
  const fabric = r2(areaExact*rate);
  const install = t.kind==="shutter" ? r2(areaExact*(t.installSqft||2.5)) : INSTALL_WIN;
  const unit = r2(fabric + motorFee + install);
  const total = r2(unit*qty);
  const tax = r2((fabric + motorFee) * qty * TAX_RATE); /* install not taxed */
  parts.push([b.w+"×"+b.h+" mm = "+area+" sq ft × $"+rate, fabric]);
  if(motorFee) parts.push([(DRIVES[c.drive]||"Motor") + (motorN>1 ? " ×"+motorN : ""), motorFee]);
  parts.push([t.kind==="shutter" ? "Install 安装 ($"+(t.installSqft||2.5)+"/sq ft)" : "Install 安装", install]);
  return {unit, total, tax, grand:r2(total+tax), parts};
}
function cartLineTotal(l){ return l.kind==="acc" ? r2(l.price*(+l.qty||1)) : priceLine(l).grand; }
/* discount only while B&M places an order for a customer (impersonation) */
function cartDiscount(sub){
  if(!imp) return {amt:0, label:""};
  const d = window._disc || {};
  let amt = 0, parts = [];
  if(+d.pct){ amt += sub*(+d.pct)/100; parts.push(d.pct+"%"); }
  if(+d.amt){ amt += +d.amt; parts.push("$"+(+d.amt)); }
  return {amt: r2(Math.min(amt, sub)), label: parts.join(" + ")};
}
function cartTotals(){
  let sub=0, tax=0;
  cart.forEach(l=>{ const p=priceLine(l); sub+=p.total; tax+=p.tax||0; });
  sub = r2(sub); tax = r2(tax);
  const d = cartDiscount(sub);
  if(d.amt > 0 && sub > 0){
    const factor = (sub - d.amt) / sub;
    tax = r2(tax * factor); /* tax follows the discounted amount */
  }
  return {sub, disc:d.amt, discLabel:d.label, tax, grand:r2(sub - d.amt + tax)};
}
function setDisc(k, v){
  window._disc = window._disc || {pct:0, amt:0};
  window._disc[k] = +v || 0;
  render();
}
const cartTotal = () => cartTotals().grand;
const cartCount = () => cart.reduce((s,l)=>s+(+l.qty||1),0);

function specSummary(l){
  if(l.kind==="acc") return "";
  const t = findType(l.product)||{}; const a = applies(t);
  const bits = [];
  if(l.loc) bits.push("&#128205; "+esc(l.loc));
  if(a.openType) bits.push(l.openType);
  if(a.opacity) bits.push(OPAC[l.opacity]||l.opacity);
  if(a.openness) bits.push("Openness 开孔率 "+l.openness);
  if(a.style) bits.push(l.style, (DRAPE_TRACKS[l.track]||{}).l);
  if(a.drive) bits.push((DRIVES[l.drive]||l.drive) + ((l.drive==="smart"||l.drive==="std") && Math.round(+l.motors)>1 ? " ×"+Math.round(+l.motors)+" motors 电机" : ""));
  bits.push(l.color);
  bits.push(l.w+" × "+l.h+" mm");
  if(a.mount) bits.push(l.mount);
  if(a.control) bits.push(l.control);
  return bits.filter(Boolean).join(" · ");
}

/* ---- password reset ---- */
async function forgotPassword(){
  const email = $("#a_email").value.trim();
  if(!email){ authError("Type your email in the box above first, then press Forgot password."); return; }
  const {error} = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if(error){ authError(error.message); return; }
  authInfo("Reset link sent to "+email+" — check your inbox and spam folder. 重置链接已发送，请查收邮箱。");

sb.auth.onAuthStateChange((event)=>{ if(event === "PASSWORD_RECOVERY") showResetForm(); });
function showResetForm(){
  $("#modalBody").className = "modal";
  $("#modalBody").innerHTML = `
    <h3>Set a new password 设置新密码</h3>
    <label>New password 新密码</label><input id="rp1" type="password" placeholder="At least 6 characters">
    <label>Confirm password 确认密码</label><input id="rp2" type="password">
    <div class="m-actions">
      <button class="btn primary" onclick="applyNewPassword()">Save password 保存</button>
    </div>`;
  $("#mask").classList.add("open","center");
}
async function applyNewPassword(){
  const p1 = $("#rp1").value, p2 = $("#rp2").value;
  if(p1.length < 6){ toast("Password must be at least 6 characters"); return; }
  if(p1 !== p2){ toast("Passwords don't match 两次输入不一致"); return; }
  const {error} = await sb.auth.updateUser({password: p1});
  if(error){ toast("Failed: "+error.message); return; }
  closeModal();
  toast("Password updated — you're signed in 密码已更新");
}
async function doAuth(){
  const email = $("#a_email").value.trim(), pass = $("#a_pass").value;
  if(!email || !pass){ authError("Enter your email and password."); return; }
  const btn = $("#authBtn"); btn.disabled = true;
  try{
    if(signupMode){
      const company = $("#a_company").value.trim();
      if(!company){ authError("Your name is required."); btn.disabled=false; return; }
      /* every new customer starts as an end user; dealer status comes via application */
      const {error} = await sb.auth.signUp({email, password:pass,
        options:{ data:{ company, contact: "", signup_role: "enduser" } }});
      if(error) throw error;
      /* if email confirmation is ON, there is no session yet */
      const {data:{session}} = await sb.auth.getSession();
      if(!session){
        authError("Account created — check your email to confirm, then sign in.");
        btn.disabled=false; return;
      }
    } else {
      const {data, error} = await sb.auth.signInWithPassword({email, password:pass});
      if(error) throw error;
      /* the B&M tab is for staff: admins and salespeople */
      if(authMode==="dealer"){
        const {data:prof} = await sb.from("profiles").select("role").eq("id", data.user.id).single();
        if(!prof || (prof.role!=="admin" && prof.role!=="sales")){
          await sb.auth.signOut();
          authError("This account doesn't have B&M staff access. Sign in as a customer, or contact B&M.");
          btn.disabled=false; return;
        }
      }
    }
    await boot();
  }catch(err){
    authError(err.message || "Something went wrong.");
  }
  btn.disabled = false;
}
async function signOut(){
  /* never lose a working quote: unfinished work lands in drafts before leaving */
  try{
    clearTimeout(window._qqT); qqUpsert();
    clearTimeout(window._impDraftT);
    if(imp) impDraftUpsert();
    else if(cart.length && (isAdmin() || isSales())) saveCartAsDraft(true);
    await new Promise(r=>setTimeout(r, 250)); /* let the draft write flush */
  }catch(e){}
  await sb.auth.signOut();
  user = null; profile = null; orders = []; imp = null; cart = [];
  $("#shell").style.display="none";
  $("#auth").classList.add("on");
}

async function loadProfile(){

  if(error){ toast("Could not load profile: "+error.message); return; }
  profile = data;
}
async function loadOrders(){
  const q = isAdmin()
    ? sb.from("orders").select("*, order_lines(*), profiles(company, phone, role)").order("placed_at",{ascending:false})
    : sb.from("orders").select("*, order_lines(*)").order("placed_at",{ascending:false});
  const {data, error} = await q;
  if(error){ toast("Could not load orders: "+error.message); return; }
  orders = data || [];
}
async function submitOrder(){
  if((isAdmin() || isSales()) && !imp){ toast(isSales() ? "Pick a customer first — order for them from Customers 请先在客户页选择客户" : "B&M staff accounts can't place orders"); return; }
  if(isEndUser()){ toast("Contact B&M to place an order"); return; }
  if(!cart.length) return;
  const btnGuard = window._submitting; if(btnGuard) return; window._submitting = true;
  try{
    const order_no = "BM-" + Date.now().toString(36).toUpperCase();
    const ct = cartTotals();
    const {data:ord, error:e1} = await sb.from("orders")
      .insert({order_no, buyer_id: imp ? imp.id : user.id, status:0, total:ct.grand,
               discount:ct.disc||0, discount_label:ct.discLabel||"", history:[{s:0,d:today()}]})
      .select().single();
    if(e1) throw e1;
    const rows = cart.map(l=>{
      if(l.kind==="acc") return {order_id:ord.id, product:l.name, kind:"acc",
        specs:{}, qty:+l.qty||1, unit_price:l.price, line_total:cartLineTotal(l)};
      const p = priceLine(l);
      return {order_id:ord.id, product:l.product, kind:"config",
        specs:{...l, summary:specSummary(l)}, qty:+l.qty||1, unit_price:p.unit, line_total:p.total};
    });
    const {error:e2} = await sb.from("order_lines").insert(rows);
    if(e2) throw e2;
    /* the quote survives submission: its details move to the order's quote, still editable & clonable */
    const cartMeta = getQuoteMeta("cart");
    if(cartMeta && Object.keys(cartMeta).length) saveQuoteMeta(ord.id, {...cartMeta});
    saveQuoteMeta("cart", {});
    if(window._cartDraftKey){ /* the draft became a real order — retire it from the drafts list */
      clearTimeout(window._cdT);
      persistDrafts(myDrafts().filter(x=>x.id!==window._cartDraftKey));
      window._cartDraftKey = null;
    }
    cart = []; saveCart();
    if(imp){ clearTimeout(window._impDraftT); impDraftUpsert(); } /* submitted — clear the live draft */
    window._disc = {pct:0, amt:0};
    sendEmailFn({type:"order_email", order_id: ord.id}); /* confirmation email — fire and forget */
    await loadOrders();
    location.hash="orders"; render();
    toast("Quote "+order_no+" submitted 报价已提交 — B&M will confirm after review");
  }catch(err){
    toast("Submit failed: " + (err.message||err));
  }
  window._submitting = false;
}
async function moveOrder(id, delta){
  const o = orders.find(x=>x.id===id); if(!o) return;
  const newStatus = Math.min(4, Math.max(0, o.status + (delta||0)));
  if(newStatus === o.status) return;
  if(newStatus === 4 && !confirm("Mark "+o.order_no+" as Delivered? The customer will see this order as complete.")) return;
  const hist = (o.history||[]).concat([{s:newStatus, d:today()}]);
  const {error} = await sb.from("orders").update({status:newStatus, history:hist}).eq("id", id);
  if(error){ toast("Update failed: "+error.message); return; }
  await loadOrders(); render();
  toast(o.order_no + " → " + STATUS[newStatus]);
}
const advanceOrder = id => moveOrder(id, 1);

async function saveProfileInfo(){
  const company = $("#pf_company").value.trim();
  if(!company){ toast("Name is required"); return; }
  const upd = {company, contact:$("#pf_contact").value.trim(), phone:$("#pf_phone").value.trim()};
  const {error} = await sb.from("profiles").update(upd).eq("id", user.id);
  if(error){ toast("Save failed: "+error.message); return; }
  Object.assign(profile, upd);
  render();
  toast("Saved 已保存");
}
async function changePasswordFromSettings(){
  const p1 = $("#pw1").value, p2 = $("#pw2").value;
  if(p1.length < 6){ toast("Password must be at least 6 characters"); return; }
  if(p1 !== p2){ toast("Passwords don't match 两次输入不一致"); return; }
  const {error} = await sb.auth.updateUser({password: p1});
  if(error){ toast("Failed: "+error.message); return; }
  $("#pw1").value = ""; $("#pw2").value = "";
  toast("Password updated 密码已更新");
}

/* ================= REALTIME AUTO-REFRESH ================= */
let _rtTimer = null;
/* re-render the current page when it's safe: not while this user is typing, never mid-modal */
function uiRefresh(){
  if(!user || !profile) return;
  if(Date.now() - (window._lastWrite||0) < 5000) return;   /* active writer keeps the wheel */
  renderNav();
  const r = cur().r;
  const typingHeavy = ["config","profile"];                /* pure input pages — leave them alone */
  if(typingHeavy.includes(r)) return;
  if($("#mask").classList.contains("open")) return;        /* a popup is up */
  if(r==="quote" && window._quote) return;                 /* someone is inside a quote form */
  render();
}
function rtPing(){
  clearTimeout(_rtTimer);
  _rtTimer = setTimeout(async ()=>{
    if(!user || !profile) return;
    await loadOrders(); await loadUnread();
    if(isAdmin()){ await loadPending(); await loadApps(); }
    uiRefresh();
  }, 800);
}
/* cross-tab safety: when another tab (or B&M) changes MY profile row, take the fresh copy
   instead of later clobbering it with this tab's stale one */
/* any profile row changed anywhere: my own row merges in; pages showing others (customers, employees) refresh */
function profileSync(payload){
  const n = payload && (payload.new || payload.record); if(!n || !profile) return;
  if(n.id === user.id && Date.now() - (window._lastWrite||0) >= 5000){
    profile.quote_drafts = n.quote_drafts || [];
    profile.followups   = n.followups   || [];
    profile.templates   = n.templates   || [];
    profile.quotes      = n.quotes      || {};
    if(!imp && n.cart && JSON.stringify(n.cart) !== JSON.stringify(cart)){
      cart = n.cart; try{ localStorage.setItem(cartKey(), JSON.stringify(cart)); }catch(e){}
    }
  }
  clearTimeout(window._psTimer);
  window._psTimer = setTimeout(uiRefresh, 600);
}
function startRealtime(){
  if(window._rt || !sb.channel) return;
  try{
    window._rt = sb.channel("live-updates")
      .on("postgres_changes", {event:"*", schema:"public", table:"orders"}, rtPing)
      .on("postgres_changes", {event:"*", schema:"public", table:"messages"}, rtPing)
      .on("postgres_changes", {event:"*", schema:"public", table:"dealer_applications"}, rtPing)
      .on("postgres_changes", {event:"*", schema:"public", table:"profiles"}, profileSync)
      .subscribe();
  }catch(e){ /* realtime unavailable — polling-free portal still works on navigation */ }
}

/* ================= EASTER EGG: the bouncing logo ================= */
const EGG_SEQ = ["ArrowLeft","ArrowRight","ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowDown","ArrowLeft","ArrowLeft","ArrowRight"];
let _eggBuf = [];
document.addEventListener("keydown", e=>{
  const t = e.target, tag = (t && t.tagName || "").toLowerCase();
  if(tag==="input" || tag==="textarea" || tag==="select") return;
  if(window._dvd){ stopDVD(); e.preventDefault(); e.stopImmediatePropagation(); return; }
  if(!String(e.key).startsWith("Arrow")){ _eggBuf = []; return; }
  _eggBuf.push(e.key);
  if(_eggBuf.length > EGG_SEQ.length) _eggBuf.shift();
  if(_eggBuf.length === EGG_SEQ.length && EGG_SEQ.every((k,i)=>_eggBuf[i]===k)){
    _eggBuf = [];
    startDVD();
  }
});
/* egg #2: click the sidebar logo 5 times fast — someone pulls the cord and the blinds come down */
(function(){
  let n = 0, t0 = 0;
  document.addEventListener("click", e=>{
    const box = e.target && e.target.closest ? e.target.closest(".logo-box") : null;
    if(!box) return;
    const now = Date.now();
    if(now - t0 > 1600) n = 0;
    t0 = now; n++;
    if(n >= 5){ n = 0; dropBlinds(); }
  });
})();
function dropBlinds(){
  if(window._blinds) return; window._blinds = true;
  const dark = theme.mode === "dark";
  /* dark portal gets white blinds, light portal gets deep green blinds */
  const slats = dark
    ? "repeating-linear-gradient(180deg,#f4f6f9 0 26px,#cdd4df 26px 34px)"
    : "repeating-linear-gradient(180deg,#24402a 0 26px,#16281b 26px 34px)";
  const boxBg = dark ? "#1a1f2b" : "#fff";
  const txt = dark ? "#fff" : "#24402a";
  const ov = document.createElement("div");
  ov.id = "blindsOverlay";
  ov.style.cssText = "position:fixed;inset:0;z-index:480;pointer-events:none;transform:translateY(-101%);transition:transform .95s cubic-bezier(.45,0,.2,1);background:" + slats + ";box-shadow:0 6px 20px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center";
  ov.innerHTML = `<div style="font-size:44px;font-weight:800;color:${txt};background:${boxBg};text-align:center;line-height:1.4;padding:26px 44px;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.35)">🪟 Enjoying the blinds?<br>帘子不错吧</div>`;
  document.body.appendChild(ov);
  setTimeout(()=>{ ov.style.transform = "translateY(0)"; }, 30);
  setTimeout(()=>{ ov.style.transition = "transform 1.1s cubic-bezier(.6,0,.3,1)"; ov.style.transform = "translateY(-101%)"; }, 2200);
  setTimeout(()=>{ ov.remove(); window._blinds = false; }, 3500);
}
/* egg #3: type the magic word (when not in a field) — the whole portal goes disco */
let _letterBuf = "";
document.addEventListener("keydown", e=>{
  const t = e.target, tag = (t && t.tagName || "").toLowerCase();
  if(tag==="input" || tag==="textarea" || tag==="select" || (t && t.isContentEditable)) return;
  if(!e.key || e.key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) return;
  _letterBuf = (_letterBuf + e.key.toLowerCase()).slice(-8);
  if(_letterBuf.endsWith("party")){ _letterBuf = ""; partyMode(); }
});
function partyMode(){

  const orig = theme.hue;

  let i = 0;
  const iv = setInterval(()=>{
    theme.hue = (orig + i*17) % 360; applyTheme(); i++;   /* not saved — your real hue comes back */
    if(i > 46){ clearInterval(iv); theme.hue = orig; applyTheme(); window._party = false; toast("Back to business 回归正业 🙂"); }
  }, 150);
}
const _raf = cb => (window.requestAnimationFrame ? window.requestAnimationFrame(cb) : setTimeout(cb, 16));
function startDVD(){
  if(window._dvd) return;
  const ov = document.createElement("div");
  ov.id = "dvdOverlay";
  ov.style.cssText = "position:fixed;inset:0;background:#000;z-index:500;overflow:hidden;cursor:pointer";
  ov.innerHTML = `
    <div id="dvdLogo" style="position:absolute;width:180px;color:#2f9e63;will-change:transform">
      <svg viewBox="0 0 350 158" width="180" xmlns="http://www.w3.org/2000/svg">
        <g fill="currentColor">
          <polygon points="8,14 112,14 106,32 14,32"/>
          <polygon points="20,40 38,40 38,138 20,124"/>
          <polygon points="46,40 64,40 64,126 46,116"/>
          <polygon points="72,40 90,40 90,114 72,107"/>
          <polygon points="98,40 112,40 112,103 98,98"/>
        </g>
        <text x="128" y="96" font-family="Georgia,serif" font-size="82" font-weight="600" fill="currentColor">B&amp;M</text>
        <text x="131" y="136" font-family="'Segoe UI',Arial,sans-serif" font-size="25" font-weight="600" letter-spacing="7" fill="currentColor">BLINDS PRO</text>
      </svg>
    </div>
    <div style="position:absolute;bottom:16px;width:100%;text-align:center;color:#555;font-size:12px">&#127881; You found it 彩蛋! · press any key to exit</div>`;
  document.body.appendChild(ov);
  ov.onclick = stopDVD;
  const colors = ["#3b6fe0","#e15241","#c9861f","#8b5cf6","#2f9e63","#0ea5e9","#e91e8c","#eab308"];
  const el = ov.querySelector("#dvdLogo");
  let x = 60 + Math.random()*160, y = 60 + Math.random()*160, vx = 2.4, vy = 2.1, ci = 0;
  window._dvd = true;
  (function frame(){
    if(!window._dvd) return;
    const W = ov.clientWidth - 180, H = ov.clientHeight - 100;
    x += vx; y += vy;
    let hit = false;
    if(x <= 0 || x >= W){ vx = -vx; x = Math.max(0, Math.min(x, W)); hit = true; }
    if(y <= 0 || y >= H){ vy = -vy; y = Math.max(0, Math.min(y, H)); hit = true; }
    if(hit){ ci = (ci+1) % colors.length; el.style.color = colors[ci]; }
    el.style.transform = "translate("+x+"px,"+y+"px)";
    _raf(frame);
  })();
}
function stopDVD(){
  window._dvd = false;
  const ov = document.getElementById("dvdOverlay");
  if(ov) ov.remove();
}

/* ---- order filter chips (per page, session-scoped) ---- */
let orderFilter = {};
function fltOf(route){ return orderFilter[route] || (orderFilter[route] = {st:null, pay:null}); }
function setFlt(route, kind, val){
  const f = fltOf(route);
  f[kind] = (f[kind]===val) ? null : val; /* click again to clear */
  render();
}
function fltMatches(o, f){
  if(f.st!=null && o.status!==f.st) return false;
  if(f.pay==="unpaid"  && (o.deposit_paid || o.paid)) return false;
  if(f.pay==="deposit" && !(o.deposit_paid && !o.paid)) return false;
  if(f.pay==="paid"    && !o.paid) return false;
  if(f.pay==="confirm" && !((o.deposit_claimed && !o.deposit_paid) || (o.pay_claimed && !o.paid))) return false;
  return true;
}
function fltBar(route, list, admin){
  const f = fltOf(route);
  const chip = (label, kind, val, n) =>
    `<button class="flt-chip ${f[kind]===val?"on":""}" onclick="setFlt('${route}','${kind}',${val==null?null:(typeof val==="string"?`'${val}'`:val)})">${label}${n!=null?` <span class="fc-n">${n}</span>`:""}</button>`;
  const cnt = st => list.filter(o=>o.status===st).length;
  const confirmN = list.filter(o=>(o.deposit_claimed && !o.deposit_paid)||(o.pay_claimed && !o.paid)).length;
  return `<div class="flt-bar">
    <button class="flt-chip ${f.st==null&&f.pay==null?"on":""}" onclick="orderFilter['${route}']={st:null,pay:null};render()">All (${list.length})</button>
    ${STATUS.map((s,i)=>cnt(i)?chip(s,"st",i,cnt(i)):"").join("")}
    <span class="flt-sep"></span>
    ${chip("Unpaid 未付","pay","unpaid")}
    ${chip("Deposit paid 已付定金","pay","deposit")}
    ${chip("Paid 已付清","pay","paid")}
    ${admin && confirmN ? chip("&#9888; Needs confirmation","pay","confirm",confirmN) : ""}
  </div>`;
}
function orderMatches(o, q){
  if(!q) return true;
  const hay = [o.order_no, (o.profiles&&o.profiles.company)||"", STATUS[o.status]||"",
    ...(o.order_lines||[]).map(l=>l.product+" "+((l.specs&&l.specs.summary)||""))].join(" ").toLowerCase();
  return hay.includes(q);
}
/* quick tab switching: keys 1..N jump to the Nth sidebar item (when not typing) */
document.addEventListener("keydown", e=>{
  if(window._dvd) return; /* screensaver active — its own handler exits */
  if(!user || !profile || isPending() || isBlocked()) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target, tag = (t && t.tagName || "").toLowerCase();
  if(tag==="input" || tag==="textarea" || tag==="select" || (t && t.isContentEditable)) return;
  const mask = $("#mask");
  if(e.key === "Escape" && mask && mask.classList.contains("open")){ closeModal(); return; }
  if(e.key === "?"){ showShortcuts(); return; }
  if(e.key === "/"){ const si = $("#searchInp"); if(si){ e.preventDefault(); si.focus(); } return; }
  const n = parseInt(e.key, 10);
  if(!n || n < 1) return;
  const nav = visNav().filter(x=>!x.foot); /* the settings cog is not part of 1-9 */
  if(n <= nav.length){
    if(mask && mask.classList.contains("open")) closeModal(); /* digits work even with a popup open */
    if(t && t.blur) t.blur();
    location.hash = nav[n-1].r; render();
  }
});

    $("#signOutBtn").style.display = "none";

function renderReports(){
  const app = $("#app");
  if(!orders.length){
    app.innerHTML = `<div class="zero"><h2>No numbers yet</h2><p>Reports build themselves from orders. As dealers order, this page fills in on its own.</p></div>`;
    return;
  }
  /* last 12 months — booked value vs actually collected (confirmed deposits + balances) */
  const months = []; const now = new Date();
  for(let i=11;i>=0;i--){
    const dte = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const lbl = dte.toLocaleString("en-US",{month:"short"}) + (dte.getMonth()===0 ? "'"+String(dte.getFullYear()).slice(2) : "");
    months.push({key: dte.getFullYear()+"-"+String(dte.getMonth()+1).padStart(2,"0"), lbl});
  }
  const inMonth = m => orders.filter(o=>String(o.placed_at).slice(0,7)===m.key);
  const byMonth = months.map(m => inMonth(m).reduce((s,o)=>s+Number(o.total),0));
  const colMonth = months.map(m => inMonth(m).reduce((s,o)=>s+(o.paid?Number(o.total):(o.deposit_paid?depositOf(o):0)),0));
  const mmx = Math.max(...byMonth)||1;
  /* by dealer */
  const dl = {};
  orders.forEach(o=>{
    const k = (o.profiles&&o.profiles.company)||"Unknown";
    dl[k] = (dl[k]||0) + Number(o.total);
  });
  const dealers = Object.entries(dl).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const dmx = Math.max(...dealers.map(x=>x[1]))||1;
  /* by product */
  const pr = {};
  orders.forEach(o=>(o.order_lines||[]).forEach(l=>{ pr[l.product] = (pr[l.product]||0) + Number(l.line_total); }));
  const products = Object.entries(pr).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const pmx = Math.max(...products.map(x=>x[1]))||1;
  /* status breakdown */
  const st = STATUS.map((s,i)=>orders.filter(o=>o.status===i).length);
  const smx = Math.max(...st)||1;
  const totVal = orders.reduce((s,o)=>s+Number(o.total),0);
  const avg = Math.round(totVal/orders.length);

  app.innerHTML = `
  <div id="pipePanel"></div>
  <div class="stats">
    <div class="stat"><div class="l">Total order value</div><div class="v">${money(totVal)}</div></div>
    <div class="stat"><div class="l">Orders</div><div class="v">${orders.length}</div></div>
    <div class="stat"><div class="l">Average order</div><div class="v">${money(avg)}</div></div>
    <div class="stat"><div class="l">Top dealer</div><div class="v" style="font-size:15px">${esc(dealers[0][0])}</div></div>
  </div>
  <div class="rgrid">
    <div class="rpanel"><h3>Revenue by month <span class="vleg"><i class="vk vk-b"></i>Booked 下单 <i class="vk vk-c"></i>Collected 已收</span></h3>
      <div class="vbars">${months.map((m,i)=>`
        <div class="vbar-w" title="${m.lbl}: booked ${money(byMonth[i])} · collected ${money(colMonth[i])}">
        <span class="vval" style="font-size:9.5px">${byMonth[i]?money(byMonth[i]):""}</span>
        <div class="vbar vb-booked" style="height:${Math.max(2,Math.round(byMonth[i]/mmx*100))}%">
          ${byMonth[i]?`<div class="vb-col" style="height:${Math.min(100,Math.round(colMonth[i]/byMonth[i]*100))}%"></div>`:""}
        </div>
        <span class="vlbl">${m.lbl}</span></div>`).join("")}
      </div>
    </div>
    <div class="rpanel"><h3>By dealer</h3>
      ${dealers.map(x=>`<div class="hrow"><span class="hl">${esc(x[0])}</span><div class="track"><div class="fill" style="width:${Math.max(2,Math.round(x[1]/dmx*100))}%"></div></div><span class="hv">${money(x[1])}</span></div>`).join("")}
      <h3 style="margin-top:20px">Orders by status</h3>
      ${STATUS.map((s,i)=>`<div class="hrow"><span class="hl">${s}</span><div class="track"><div class="fill" style="width:${Math.max(2,Math.round(st[i]/smx*100))}%;background:${i===0?"var(--amber)":i===4?"var(--green)":"#8fa0c2"}"></div></div><span class="hv">${st[i]}</span></div>`).join("")}
    </div>
    <div class="rpanel" style="grid-column:1/-1"><h3>By product</h3>
      ${products.map(x=>`<div class="hrow"><span class="hl">${esc(x[0])}</span><div class="track"><div class="fill" style="width:${Math.max(2,Math.round(x[1]/pmx*100))}%"></div></div><span class="hv">${money(x[1])}</span></div>`).join("")}
    </div>
  </div>`;
  if(isAdmin()) fillPipeline();
}
/* the numbers success is measured by: quotes/week, conversion, portal activity — per person */
async function fillPipeline(){
  const el = $("#pipePanel"); if(!el) return;
  const {data:profs} = await sb.from("profiles").select("id,company,contact,role,quote_drafts");
  const now = Date.now(), d7 = new Date(now-7*86400000).toISOString().slice(0,10), d30 = new Date(now-30*86400000).toISOString().slice(0,10);
  const who = {}; (profs||[]).forEach(p=>{ who[p.id] = p.contact || p.company || "?"; });
  const drafts = [];
  (profs||[]).forEach(p=>(p.quote_drafts||[]).forEach(d=>{ if(!d.tmpl && !d.binned) drafts.push({owner:p.id, created:d.created||""}); }));
  const q7 = {}, q30drafts = drafts.filter(d=>d.created>=d30).length;
  drafts.filter(d=>d.created>=d7).forEach(d=>{ q7[d.owner]=(q7[d.owner]||0)+1; });
  orders.filter(o=>String(o.placed_at).slice(0,10)>=d7).forEach(o=>{ q7[o.placed_by||o.buyer_id]=(q7[o.placed_by||o.buyer_id]||0)+1; });
  const totalQ7 = Object.values(q7).reduce((a,b)=>a+b,0);
  const o30 = orders.filter(o=>String(o.placed_at).slice(0,10)>=d30).length;
  const conv = (o30+q30drafts)>0 ? Math.round(o30/(o30+q30drafts)*100) : null;
  el.innerHTML = `<div class="rpanel" style="margin-bottom:16px"><h3>Pipeline this week 本周动态</h3>
    <div class="stats" style="margin-bottom:10px">
      <div class="stat"><div class="l">Quotes created (7d)</div><div class="v">${totalQ7}</div></div>
      <div class="stat"><div class="l">Orders placed (7d)</div><div class="v">${orders.filter(o=>String(o.placed_at).slice(0,10)>=d7).length}</div></div>
      <div class="stat"><div class="l">Quote &#8594; order (30d)</div><div class="v">${conv===null?"—":conv+"%"}</div></div>
      <div class="stat"><div class="l">Open drafts</div><div class="v">${drafts.length}</div></div>
    </div>
    ${Object.keys(q7).length?`<div style="font-size:12.5px;color:var(--muted);margin-bottom:4px">By person 按人 (7d):</div>
      ${Object.entries(q7).sort((a,b)=>b[1]-a[1]).map(([id,n])=>`<div class="hrow"><span class="hl">${esc(who[id]||"?")}</span><div class="track"><div class="fill" style="width:${Math.max(4,Math.round(n/Math.max(...Object.values(q7))*100))}%"></div></div><span class="hv">${n}</span></div>`).join("")}`
    :`<div style="font-size:13px;color:var(--muted)">No quotes or orders in the last 7 days. 近7天暂无报价或订单。</div>`}
  </div>`;
}

/* shared caller for our edge functions */
async function sendEdgeFn(name, payload){
  try{
    const {data:{session}} = await sb.auth.getSession();
    if(!session) return {error:"no session"};
    const r = await fetch(SB_URL + "/functions/v1/" + name, {
      method:"POST",
      headers:{ "Authorization":"Bearer "+session.access_token, "apikey":SB_KEY, "Content-Type":"application/json" },
      body: JSON.stringify(payload)
    });
    return await r.json().catch(()=>({ok:r.ok}));
  }catch(e){ return {error:String(e)}; }
}

function impDraftUpsert(){
  if(!imp || !profile) return;
  const id = window._impDraftKey || ("imp_" + imp.id); /* a loaded clone keeps its own identity */
  const list = myDrafts().slice();
  const i = list.findIndex(x=>x.id===id);
  if(!cart.length){ if(i>=0){ list.splice(i,1); persistDrafts(list); } return; }
  const prev = i>=0 ? list[i] : null;
  const rec = { id, name: prev ? prev.name : (imp.company||"Customer")+" — unfinished 未完成", created: prev ? prev.created : today(),
    lines: JSON.parse(JSON.stringify(cart)), meta: getQuoteMeta("cart") || {},
    impId: imp.id, impCompany: imp.company||"", impRole: imp.role||"enduser", impRegistered: imp.registered===true };
  const changed = !prev || JSON.stringify(prev.lines)!==JSON.stringify(rec.lines);
  carryDraft(rec, prev, changed);
  if(i>=0) list[i] = rec; else list.push(rec);
  persistDrafts(list);
}
function exitImp(){
  /* unfinished work survives: the customer's cart + quote details live as a draft in the quote list */
  clearTimeout(window._impDraftT);
  if(imp && cart.length){
    impDraftUpsert();
    toast(`Draft saved for ${imp.company||"customer"} — find it under Quotes 已存入报价草稿`);
  } else if(imp){ impDraftUpsert(); } /* empty cart clears any stale draft */
  imp = null;
  window._impDraftKey = null;
  window._cfg = null;
  window._quote = null;
  window._pay = null;
  window._disc = {pct:0, amt:0};
  try{ cart = JSON.parse(localStorage.getItem(cartKey())) || []; }catch(e){ cart = []; }
  location.hash = "customers";
  render();
}
/* resume a customer's draft: re-enter their view; edits keep updating THIS draft in place */
function resumeImpDraft(dq){
  imp = { id:dq.impId, role:dq.impRole||"enduser", company:dq.impCompany||"", registered:dq.impRegistered===true };
  window._disc = {pct:0, amt:0};
  window._cfg = null;
  window._impDraftKey = dq.id;
  cart = JSON.parse(JSON.stringify(dq.lines));
  saveQuoteMeta("cart", dq.meta || {});
  location.hash = "cart"; render();
  toast(`Back in ${dq.impCompany||"customer"}'s view — quote loaded 已载入`);
}

async function decideApp(appId, userId, accept){
  if(!accept && !confirm("Deny this application?")) return;
  const {data:app_, error:e0} = await sb.from("dealer_applications").select("*").eq("id",appId).single();
  if(e0){ toast("Failed: "+e0.message); return; }
  const {error:e1} = await sb.from("dealer_applications")
    .update({status: accept?"accepted":"denied", decided_at: new Date().toISOString()}).eq("id", appId);
  if(e1){ toast("Failed: "+e1.message); return; }
  if(accept){
    const {error:e2} = await sb.from("profiles").update({
      role:"buyer", approved:true,
      company: app_.company, contact: app_.contact, phone: app_.phone}).eq("id", userId);
    if(e2){ toast("Application marked, but role upgrade failed: "+e2.message); return; }
  }
  toast(accept ? app_.company+" is now a dealer" : "Application denied");
  await loadApps();
  renderNav();
  renderApplications();
}

let unreadCount = 0;
async function loadUnread(){
  const q = isAdmin()
    ? sb.from("messages").select("id",{count:"exact",head:true}).eq("read_by_admin",false)
    : sb.from("messages").select("id",{count:"exact",head:true}).eq("dealer_id",user.id).eq("read_by_dealer",false);

async function fetchThread(dealerId){
  const {data, error} = await sb.from("messages").select("*")
    .eq("dealer_id", dealerId).order("created_at",{ascending:true});
  if(error){ toast("Could not load messages: "+error.message); return []; }
  return data || [];
}
function bubbleHTML(m){
  const mine = m.sender_id === user.id;
  const when = String(m.created_at).slice(0,16).replace("T"," ");
  return `<div class="bubble ${mine?"me":"them"}">
    ${m.order_no?`<div><span class="ord">${esc(m.order_no)}</span></div>`:""}
    <div>${esc(m.body)}</div><div class="meta">${when}</div></div>`;
}
function chatHTML(msgs, orderNos, sendFn, headTitle, backBtn){
  return `<div class="chat-wrap">
    <div class="chat-head"><span>${esc(headTitle)}</span>${backBtn||""}</div>
    <div class="chat-body" id="chatBody">
      ${msgs.length ? msgs.map(bubbleHTML).join("") : `<div class="chat-empty">No messages yet. Say hello.</div>`}
    </div>
    <div class="chat-compose">
      ${orderNos.length?`<select id="msgOrder"><option value="">No order</option>${orderNos.map(n=>`<option>${esc(n)}</option>`).join("")}</select>`:""}

      <button class="btn primary" onclick="${sendFn}">Send</button>

}
function scrollChat(){ const el=$("#chatBody"); if(el) el.scrollTop = el.scrollHeight; }

async function renderAdminMessages(){
  const t = window._thread;
  $("#app").innerHTML = `<div class="loading">Loading conversations…</div>`;
  const {data, error} = await sb.from("messages")
    .select("*, profiles!messages_dealer_id_fkey(company)")
    .order("created_at",{ascending:false});
  if(error){ $("#app").innerHTML = `<div class="zero"><h2>Could not load</h2><p>${esc(error.message)}</p></div>`; return; }
  const threads = {};
  (data||[]).forEach(m=>{
    if(!threads[m.dealer_id]) threads[m.dealer_id] = {dealer_id:m.dealer_id, company:(m.profiles&&m.profiles.company)||"Dealer", last:m, unread:0};
    if(!m.read_by_admin) threads[m.dealer_id].unread++;
  });
  const list = Object.values(threads);
  /* two-pane inbox: contacts on the left, the open conversation on the right */
  $("#app").innerHTML = `

    <div class="msg-left">

          ${x.unread?`<span class="badge" style="position:static">${x.unread}</span>`:`<span style="color:#c2c7d1;font-size:12px">${String(x.last.created_at).slice(0,10)}</span>`}
        </div>`).join("")}</div>`
      : `<div style="color:var(--muted);font-size:13px;padding:8px 4px">No conversations yet — start one above. 暂无对话。</div>`}
    </div>
    <div id="msgPane">${t ? `<div class="loading">Loading conversation…</div>` : `<div class="zero" style="margin:0"><h2>Pick a conversation</h2><p>Choose a customer on the left, or press <b>+ New conversation</b> to start one. 在左侧选择对话或新建。</p></div>`}</div>

async function renderAdminThreadInto(t){

  const pane = $("#msgPane"); if(!pane) return;

    `<button class="btn ghost sm msg-back" onclick="window._thread=null;renderAdminMessages()">&#8592; All 返回</button>`);

  sb.from("messages").update({read_by_admin:true})
    .eq("dealer_id", t.dealer_id).eq("read_by_admin", false)
    .then(()=>{ loadUnread().then(renderNav); });

const PRODUCT_IMG = {"Roller Shades":"img/roller1.jpg","Zebra Shades":"img/zebra1.jpg","Shangri-La Shades":"img/shangrila1.jpg","Roman Shades":"img/roman1.jpg","Woven Shades":"img/woven1.jpg","Honeycomb Shades":"img/honeycomb1.jpg","Bamboo Shades":"img/bamboo1.jpg","Layered Shades/Butterfly":"img/butterfly1.jpg","Wood Blinds":"img/blinds.jpg","Faux Wood Blinds":"img/blinds3.jpg","Wood Shutters":"img/shutter.jpg","Faux Wood Shutters":"img/shutter2.jpg","Outdoor Windproof Shades":"img/outoor1.jpg","Fabric Drapery":"img/fabricdrapery.jpg","Sheer Drapery":"img/sheerdrapery.jpg"};
function swatchHTML(c, t){
  const img = PRODUCT_IMG[t.name];
  return img
    ? `<div class="swatch photo" style="background:${c.grad};background-image:url('${img}')"></div>`
    : `<div class="swatch" style="background:${c.grad}">${c.ico}</div>`;
}
function catalogPrice(t){
  if(t.kind==="drape") return "from "+money(Math.min(...Object.values(t.bases)))+" / window 每窗";
  if(t.kind==="shutter") return money(t.rate)+" / sq ft";
  let min;
  if(t.open) min = Math.min(...Object.values(t.open));
  else if(t.matrix) min = Math.min(...Object.values(t.matrix).map(v=>Math.min(v.semi, v.blackout)));
  else if(t.openTypes) min = Math.min(...Object.values(t.openTypes).map(v=>v.base));
  else if(t.rates) min = Math.min(...Object.values(t.rates));
  else min = t.base||0;
  return "from "+money(min)+" / sq ft";
}
/* ---- saved templates: a favorite configuration you can re-add in one click ---- */
function myTemplates(){ return (profile && Array.isArray(profile.templates)) ? profile.templates : []; }
function persistTemplates(list){
  if(!profile) return;
  window._lastWrite = Date.now();
  profile.templates = list;
  sb.from("profiles").update({templates:list}).eq("id", user.id).then(()=>{});
}
function saveTemplate(i){
  const l = cart[i]; if(!l || l.kind==="acc") return;
  const def = l.product + (l.w&&l.h ? ` ${l.w}×${l.h}mm` : "");
  const name = prompt("Template name 模板名称:", def);
  if(!name) return;
  const list = myTemplates().concat([{name:name.trim(), line:JSON.parse(JSON.stringify({...l, qty:1}))}]);
  persistTemplates(list);
  toast("Template saved 已存为模板 ★");
  render();
}
function useTemplate(idx){
  const t = myTemplates()[idx]; if(!t) return;
  cart.push(JSON.parse(JSON.stringify(t.line)));
  saveCart();
  toast(`"${t.name}" added to cart 已加入购物车`);
  renderNav(); render();
}
function deleteTemplate(idx){
  const list = myTemplates().slice(); list.splice(idx,1);
  persistTemplates(list);
  render();

    openType: (t.openTypes||t.matrix) ? Object.keys(t.openTypes||t.matrix)[0] : null,

function setCfg(k,v){ window._cfg[k]=v; renderConfig(); }
/* dims stored canonically in mm; inputs may be in mm or inches */
function setDim(k,v){
  const c = window._cfg;
  const mm = (c.unit||"mm")==="mm" ? (+v||0) : Math.round((+v||0)*25.4);
  c[k] = Math.max(0, mm);

}
function setUnit(u){ window._cfg.unit = u; renderConfig(); }
function dimHint(){
  const c = window._cfg;

    ? `= ${r2(c.w/25.4)} × ${r2(c.h/25.4)} in`
    : `= ${c.w} × ${c.h} mm (production uses mm)`;
}
function setCfgQty(v){ window._cfg.qty=Math.max(1,Math.round(+v)||1); refreshSummary(); }
function pillRow(step, label, key, opts){
  const c = window._cfg;

    <div class="opts">${opts.map(o=>`
      <button class="opt ${c[key]===o.v?"on":""}" onclick="setCfg('${key}','${String(o.v).replace(/'/g,"\\'")}')">${o.l||o.v}

/* edit a cart line: reopen it in the configurator, save replaces in place */
function editLine(i){
  if(!cart[i] || cart[i].kind==="acc") return;
  window._cfg = JSON.parse(JSON.stringify(cart[i]));
  window._editIdx = i;
  location.hash = "config"; render();
}
function cartQty(i,d){ cart[i].qty = Math.max(1,(+cart[i].qty||1)+d); saveCart(); render(); }
function cartQtySet(i,v){ cart[i].qty = Math.max(1, Math.round(+v)||1); saveCart(); render(); }
function dupLine(i){
  if(!cart[i]) return;
  const copy = JSON.parse(JSON.stringify(cart[i]));
  cart.splice(i+1, 0, copy);
  saveCart(); render();
  toast("Line duplicated 已复制 — edit the copy to tweak it");
}
/* undo-able removals */
function toastUndo(msg){
  const t = $("#toast");
  t.innerHTML = `${msg} <button onclick="undoCart()" style="margin-left:12px;background:none;border:1px solid rgba(255,255,255,.5);border-radius:6px;color:#ffd479;font-weight:800;padding:3px 12px;cursor:pointer;font-size:13px">Undo 撤销</button>`;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.classList.remove("show"); window._undoCart = null; }, 6000);
}
function undoCart(){
  const u = window._undoCart; if(!u) return;
  if(u.all) cart = u.all;
  else cart.splice(Math.min(u.idx, cart.length), 0, u.line);
  window._undoCart = null;
  saveCart(); render();
  const t = $("#toast"); t.classList.remove("show"); clearTimeout(t._h);
}
function rmLine(i){
  const line = cart[i]; if(!line) return;
  window._undoCart = { line: JSON.parse(JSON.stringify(line)), idx: i };
  cart.splice(i,1); saveCart(); render();
  toastUndo("Line removed 已删除");
}
function clearCart(){
  if(!cart.length) return;
  window._undoCart = { all: JSON.parse(JSON.stringify(cart)) };
  cart = []; saveCart(); render();
  toastUndo("Order cleared 已清空");
}

const BOT_GO = { go_catalog:["catalog","showroom"], go_pay:["pay","showroom"], go_orders:["orders","orders"], go_apply:["apply","apply"], go_messages:["messages","showroom"] };
function toggleBot(open){
  const p = $("#botPanel");
  const on = open===undefined ? !p.classList.contains("open") : open;
  p.classList.toggle("open", on);
  if(on){
    try{ const s = JSON.parse(localStorage.getItem("bm_bot_size"));
      if(s && s.w){ p.style.width = s.w; p.style.height = s.h; p.style.maxHeight = "none"; } }catch(e){}
    if(!$("#botMsgs").children.length) botGo("start");
  }
}
/* drag the top-left grip to resize the assistant (anchored bottom-right, so dragging out = bigger) */
(function(){
  let drag = null;
  document.addEventListener("pointerdown", e=>{
    if(!(e.target.closest && e.target.closest("#botGrip"))) return;
    const r = $("#botPanel").getBoundingClientRect();
    drag = { x:e.clientX, y:e.clientY, w:r.width||360, h:r.height||480 };
    e.preventDefault();
  });
  document.addEventListener("pointermove", e=>{
    if(!drag) return;
    const p = $("#botPanel");
    const w = Math.min(Math.max(drag.w + (drag.x - e.clientX), 300), Math.max(300, window.innerWidth - 36));
    const h = Math.min(Math.max(drag.h + (drag.y - e.clientY), 340), Math.max(340, window.innerHeight - 120));
    p.style.width = w + "px"; p.style.height = h + "px"; p.style.maxHeight = "none";
  });
  document.addEventListener("pointerup", ()=>{
    if(!drag) return;
    const p = $("#botPanel");
    try{ localStorage.setItem("bm_bot_size", JSON.stringify({w:p.style.width, h:p.style.height})); }catch(e){}
    drag = null;
  });
})();
function botBubble(cls, html){
  const m = document.createElement("div");
  m.className = "bot-b "+cls; m.innerHTML = html;
  $("#botMsgs").appendChild(m);
  $("#botMsgs").scrollTop = 1e6;
}
function botGo(id, label){
  if(label) botBubble("me", esc(label));
  if(BOT_GO[id]){ /* navigation choice — jump to the right tab for this role */
    const [buyerR, endR] = BOT_GO[id];
    const routes = visNav().map(n=>n.r);
    const r = routes.includes(buyerR) ? buyerR : (routes.includes(endR) ? endR : routes[0]);
    toggleBot(false);
    location.hash = r; render();
    return;
  }
  const node = BOT[id]; if(!node) return;
  $("#botChips").innerHTML = "";
  if(id==="start" && !label){ $("#botMsgs").innerHTML=""; }
  const t = document.createElement("div");
  t.className = "bot-typing"; t.textContent = "typing… 输入中";
  $("#botMsgs").appendChild(t); $("#botMsgs").scrollTop = 1e6;
  setTimeout(()=>{
    t.remove();
    const says = Array.isArray(node.say) ? node.say : [node.say];
    let pick = says[Math.floor(Math.random()*says.length)];
    if(says.length > 1 && pick === window._botLast) pick = says[(says.indexOf(pick)+1) % says.length];
    window._botLast = pick;
    botBubble("them", pick);
    $("#botChips").innerHTML = node.opts.map(([l,next])=>
      `<button class="bot-chip" onclick="botGo('${next}', ${JSON.stringify(l).replace(/"/g,"&quot;")})">${l}</button>`).join("");
  }, 420 + Math.random()*260);
}

function draftToQ(dq){
  if(dq.kind==="quick"){
    const lines = (dq.qlines||[]).filter(l=>String(l.name||"").trim()).map(l=>({name:l.name, spec:l.spec||"", qty:+l.qty||1, unit:r2(+l.unit||0), pre:r2((+l.qty||1)*(+l.unit||0)), taxed:l.taxed!==false}));
    const sub = r2(lines.reduce((a,l)=>a+l.pre,0));
    const disc = Math.min(sub, r2(+((dq.meta&&dq.meta.discount)||0)));
    const taxBase = r2(lines.filter(l=>l.taxed).reduce((a,l)=>a+l.pre,0));
    const tax = r2(taxBase * (sub>0 ? (sub-disc)/sub : 1) * TAX_RATE);
    return {lines, sub, disc, discLabel:"", tax, grand:r2(sub-disc+tax), who:{}, ref:"QUOTE"};
  }
  const lines = (dq.lines||[]).map(l=>{ const p = priceLine(l);
    return {name: l.kind==="acc" ? l.name : l.product, spec: l.kind==="acc" ? "" : specSummary(l), qty:+l.qty||1, unit:p.unit, pre:p.total, tax:p.tax||0}; });
  const sub = r2(lines.reduce((a,l)=>a+l.pre,0)); const tax = r2(lines.reduce((a,l)=>a+(l.tax||0),0));
  return {lines, sub, disc:0, discLabel:"", tax, grand:r2(sub+tax), who:{}, ref:"QUOTE"};
}

async function doReassign(kind, refId, tid, tname){
  const emp = window._empCache; if(!emp) return;
  closeModal();
  try{
    if(kind==="order" || kind==="all"){
      const ids = kind==="order" ? [refId] : orders.filter(o=>o.placed_by===emp.id).map(o=>o.id);
      for(const oid of ids){
        const {error} = await sb.from("orders").update({placed_by:tid}).eq("id", oid);
        if(error) throw error;
        const o = orders.find(x=>x.id===oid); if(o) o.placed_by = tid;
      }
    }
    if(kind==="quote" || kind==="all"){
      /* fresh copies of both sides so nothing gets clobbered */
      const {data:target} = await sb.from("profiles").select("id,quote_drafts,followups").eq("id", tid).single();
      if(!target) throw new Error("target not found");
      const moving = (emp.quote_drafts||[]).filter(d => kind==="all" ? !d.tmpl : d.id===refId);
      if(moving.length){
        const movedIds = moving.map(d=>d.id);
        const stamped = moving.map(d => stampDraft({...d}, `reassigned 转移: ${emp.company||""} → ${tname}`, "B&M"));
        const keepQ = (emp.quote_drafts||[]).filter(d => !movedIds.includes(d.id));
        const fuMove = (emp.followups||[]).filter(f => !f.done && f.ref.t==="draft" && movedIds.includes(f.ref.id));
        const keepF = (emp.followups||[]).filter(f => !fuMove.includes(f));
        const {error:e1} = await sb.from("profiles").update({
          quote_drafts: (target.quote_drafts||[]).concat(stamped),
          followups: (target.followups||[]).concat(fuMove)
        }).eq("id", tid);
        if(e1) throw e1;
        const {error:e2} = await sb.from("profiles").update({quote_drafts:keepQ, followups:keepF}).eq("id", emp.id);
        if(e2) throw e2;
        emp.quote_drafts = keepQ; emp.followups = keepF;
        if(tid === user.id && profile){ /* B&M took it over — sync own workspace */
          profile.quote_drafts = (target.quote_drafts||[]).concat(stamped);
          profile.followups = (target.followups||[]).concat(fuMove);
        }
      }
    }
    /* the goodbye depends on why they're leaving */
    const reason = kind==="all" ? window._raReason : null;
    window._raReason = null;
    if(reason === "fire"){
      const {error:eS} = await sb.from("profiles").update({status:"suspended"}).eq("id", emp.id);
      if(!eS) emp.status = "suspended";
      toast(`Reassigned to ${tname} — account suspended 已转移，账号已停用`);
    } else if((reason === "vaca" || reason === "quit") && emp.registered !== false){
      const body = reason === "vaca"
        ? `Hi ${emp.contact||emp.company||""} — your quotes, sales and follow-ups are with ${tname} while you're away. Have a great vacation! 你的报价与订单已由 ${tname} 接手，祝假期愉快！🏖`
        : `Hi ${emp.contact||emp.company||""} — your quotes and sales have been transferred to ${tname}. Thank you for everything, and good luck finding your next job! 你的工作已交接给 ${tname}。感谢你的付出，祝早日找到好工作！`;
      await sb.from("messages").insert({dealer_id:emp.id, sender_id:user.id, body, order_no:null, read_by_admin:true, read_by_dealer:false});
      toast(reason==="vaca" ? `Reassigned to ${tname} — bon-voyage note sent 已转移并送上祝福 🏖` : `Reassigned to ${tname} — farewell note sent 已转移并送上告别`);
    } else {
      toast(`Reassigned to ${tname} 已转移 ✓`);
    }
  }catch(e){ toast("Reassign failed: "+(e.message||e)); }
  renderEmployees();
}

function quoteLines(orderId){
  let lines, who = imp || profile || {}, ref;
  if(orderId){
    const o = orders.find(x=>x.id===orderId); if(!o) return null;
    if(o.profiles) who = {company:o.profiles.company, phone:o.profiles.phone, role:o.profiles.role};
    lines = o.order_lines.map(l=>{
      if(l.kind!=="acc" && l.specs && l.specs.product){
        const p = priceLine(l.specs);
        return {name:l.product, spec:(l.specs.summary||""), qty:+l.qty||1, unit:p.unit, pre:p.total, tax:p.tax||0};
      }
      const pre = r2((+l.unit_price||0)*(+l.qty||1));
      const accTax = (l.specs && l.specs.taxed === false) ? 0 : r2(pre*TAX_RATE); /* accessories are product — taxed unless flagged */
      return {name:l.product, spec:(l.specs&&l.specs.summary)||"", qty:+l.qty||1, unit:+l.unit_price||0, pre, tax:accTax};
    });
    ref = o.order_no;
  } else {
    if(!cart.length) return null;
    lines = cart.map(l=>{
      const p = priceLine(l);
      return {name:l.kind==="acc"?l.name:l.product, spec:specSummary(l), qty:+l.qty||1, unit:p.unit, pre:p.total, tax:p.tax||0};
    });
    ref = "CART";
  }
  let sub = r2(lines.reduce((s,x)=>s+x.pre,0));
  let tax = r2(lines.reduce((s,x)=>s+x.tax,0));
  let disc = 0, discLabel = "";
  if(orderId){
    const o = orders.find(x=>x.id===orderId);
    if(o && Number(o.discount) > 0 && sub > 0){
      disc = r2(Number(o.discount));
      discLabel = o.discount_label || "";
      tax = r2(tax * (sub - disc) / sub);
    }
  } else {
    const d = cartDiscount(sub);
    if(d.amt > 0 && sub > 0){ disc = d.amt; discLabel = d.label; tax = r2(tax * (sub - disc) / sub); }
  }
  return {lines, sub, disc, discLabel, tax, grand:r2(sub - disc + tax), who, ref};
}

const _ts = () => new Date().toISOString().slice(0,16).replace("T"," ");
function stampDraft(rec, action, by){
  rec.history = (rec.history||[]).slice(-28);
  rec.history.push({t:_ts(), by: by || (profile && (profile.contact||profile.company||profile.email)) || "?", a:action, n:draftCount(rec), v:draftTotal(rec)});
  return rec;
}
function carryDraft(rec, prev, contentChanged){
  rec.history = prev ? (prev.history||[]).slice() : [];
  rec.approved = prev ? prev.approved : false;
  rec.approvedBy = prev ? prev.approvedBy : undefined;
  rec.approvedAt = prev ? prev.approvedAt : undefined;
  if(!prev){ stampDraft(rec, "created 创建"); return rec; }
  if(contentChanged){
    if(rec.approved){ rec.approved = false; stampDraft(rec, "approval reset — edited 修改后需重新批准", "system"); }
    stampDraft(rec, "edited 修改");
  }
  return rec;
}

function finishFU(id, outcome){
  const list = myFUs().slice();
  const i = list.findIndex(x=>x.id===id); if(i<0) return;
  const note2 = $("#fuo_n") ? $("#fuo_n").value.trim() : "";
  list[i] = {...list[i], done:true, doneAt:today(), outcome, outcomeNote:note2};
  persistFUs(list);
  /* the outcome becomes part of the quote's history timeline — and drives what happens next */
  if(list[i].ref.t === "draft"){
    const dl = myDrafts().slice(); const j = dl.findIndex(x=>x.id===list[i].ref.id);
    if(j>=0){
      dl[j] = stampDraft({...dl[j]}, "follow-up 跟进: "+outcome+(note2?" — "+note2:""));
      if(outcome.startsWith("Lost")) dl[j].lost = true;
      if(outcome.startsWith("Ready")) dl[j].lost = false;
      persistDrafts(dl);
    }
  }
  closeModal();
  if(outcome.startsWith("Ready")){
    toast("Logged ✓ — opening the quote to close the deal 去成交 →");
    setTimeout(()=>openFURef(id), 80);
    return;
  }
  toast("Logged 已记录 ✓"); render();
}

function cartDraftUpsert(){
  if(imp || !profile || !window._cartDraftKey || !cart.length) return;
  const list = myDrafts().slice();
  const i = list.findIndex(x=>x.id===window._cartDraftKey);
  if(i < 0){ window._cartDraftKey = null; return; }
  const prev = list[i];
  const rec = {...prev, lines: JSON.parse(JSON.stringify(cart)), meta: getQuoteMeta("cart") || prev.meta || {}};
  const changed = JSON.stringify(prev.lines)!==JSON.stringify(rec.lines) || JSON.stringify(prev.meta)!==JSON.stringify(rec.meta);
  carryDraft(rec, prev, changed);
  if(changed){ list[i] = rec; persistDrafts(list); }
}
function saveCartAsDraft(silent){
  if(!cart.length) return null;
  if(window._cartDraftKey && myDrafts().some(x=>x.id===window._cartDraftKey)){ cartDraftUpsert(); return null; } /* already living in the list */
  const m = getQuoteMeta("cart") || {};
  const d = { id:"d"+Date.now().toString(36), name: m.customer || m.dealer || m.qno || ("Quote "+today()),
              created: today(), lines: JSON.parse(JSON.stringify(cart)), meta: m };
  stampDraft(d, "created 创建");
  persistDrafts(myDrafts().concat([d]));
  window._cartDraftKey = d.id; /* from now on the cart IS this draft */
  if(!silent) toast("Quote saved to the list 已存入报价列表");
  return d;
}
function newQuote(){

function loadDraft(i){
  const dq = myDrafts()[i]; if(!dq) return;
  if(dq.kind==="quick"){
    window._qq = JSON.parse(JSON.stringify({meta:dq.meta, lines:dq.qlines}));
    window._qq.draftId = dq.id; /* edit in place — changes keep auto-saving to this same draft */
    window._quote = { qq:true };
    location.hash = "quote"; render();
    toast(`"${dq.name}" opened — edits auto-save 已打开，自动保存`);
    return;
  }
  if(dq.impId && (isAdmin() || isSales()) && !imp){ resumeImpDraft(dq); return; }
  if(cart.length && !window._cartDraftKey) saveCartAsDraft(true);
  cart = JSON.parse(JSON.stringify(dq.lines));
  saveQuoteMeta("cart", dq.meta || {});
  window._cartDraftKey = dq.id; /* edit in place — the draft stays in the list and follows your edits */
  saveCart();
  afterQuoteLoadNav();
  toast(`"${dq.name}" loaded — edits save to it automatically 已载入，自动保存`);
}

function cloneDraft(i){

  i = draftIdx(i);

  const copy = JSON.parse(JSON.stringify(dq));
  copy.id = (dq.kind==="quick" ? "q" : "d") + Date.now().toString(36);
  copy.name = dq.name.replace(/ \(copy 副本\)$/,"") + " (copy 副本)";
  copy.created = today();
  copy.approved = false; delete copy.approvedBy; delete copy.approvedAt; delete copy.tmpl;
  if(copy.meta) copy.meta = {...copy.meta, qno: dq.kind==="quick" ? "QQ-"+Date.now().toString(36).toUpperCase().slice(-5) : ""};
  stampDraft(copy, `cloned from "${dq.name}" 克隆`);
  const list = myDrafts().slice(); list.splice(i+1, 0, copy); persistDrafts(list);
  render();
  toast(`Clone created 已克隆 ✓ — press Load 载入 to open it`);
}

function restoreDraft(i){

function destroyDraft(i){

function purgeOldBinned(){ /* the bin empties itself after 30 days */
  const cutoff = new Date(Date.now() - 30*86400000).toISOString().slice(0,10);
  const list = myDrafts();
